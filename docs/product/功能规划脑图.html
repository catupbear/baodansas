- 创建用户
- 编辑用户信息
- 重置密码
- 启用/禁用账号
- 角色分配

  - 企业管理员
  - 普通员工
### 企业管理（超管）
- 添加企业
- 编辑企业信息
- 启用/禁用企业

### 识别记录列表

- 重新识别
- 标记正常

- 快捷原因选择
- 手动输入原因
- 确认标记

- 列表内撤销
- 预览弹窗内撤销

### 基本信息
- 文件名（可跳转云存储）
- 群名/发送人（可编辑）
- 识别时间
- 状态

- 逐行展示所有字段
- 点击编辑

- 监控群聊标签
- 监控用户标签
- 钉钉目标链接
- 关联账号
- 字段映射数量

- 配置名称
- 群聊监控（多选搜索）
- 私聊监控（多选搜索）
- 钉钉文档链接
- 绑定账号
- 字段映射表格

  - 自定义钉钉列名
### 配置操作
- 启用/禁用开关
- 编辑
- 删除
- 刷新通讯录数据

### 默认映射
- 导出列名编辑
- OCR字段映射
### 保司专属映射
- 新增保司映射
- 编辑保司映射
- 删除保司映射

### 模板训练
- 选择保司/险种/版本
- 上传2-5份PDF样本
- 训练结果
  - 整体准确率
  - 不稳定字段列表
  - 自动注册模板ID
### 模板管理
- 已注册模板列表
- 保司/险种/版本/状态
### 训练记录
- 历史训练列表
- 命中率统计
### 告警中心
- 状态筛选
- 级别筛选
- 标记已处理
- 分页

## 通讯录管理
### 联系人编辑
- 编辑群名
- 编辑联系人名称
### 通讯录同步
- 手动刷新通讯录
- 24小时缓存机制

### 会话列表
- 搜索会话
- 头像/名称/最后消息/时间
- 消息数徽标
### 聊天详情
- 消息列表（倒序加载）
- 多消息类型展示

  - 图片（可放大灯箱）
  - 文件
  - 语音/视频

- 加载更早消息
### 操作功能
- 拉取消息
- 同步通讯录
- 自动刷新（30秒）
- 编辑联系人
### 统计信息
- 消息总数
- 最新SEQ值
- 消息类型统计

### 企业微信
- 消息拉取与解密
- 通讯录同步
- 文件下载
### 腾讯云COS
- 保单PDF存储
- 媒体文件存储
- CDN加速
### OCR引擎
- 火山引擎OCR（主）
- 百度OCR（备）
- pdfplumber本地提取
### 钉钉多维表格
- 识别结果自动同步
- 多目标配置
`;

const { Markmap } = window.markmap;
const mm = Markmap.create('#mindmap', {
  colorFreezeLevel: 2,
  duration: 300,
  maxWidth: 300,
  initialExpandLevel: 2,
  zoom: true,
  pan: true,
}, root);
