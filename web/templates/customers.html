{% raw %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户管理 - 午虎AI保单台账</title>
    <script src="/static/vue.global.prod.js"></script>
    <link href="/static/tailwind.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #c2410c;
            --primary-light: #ea580c;
            --primary-bg: #fff7ed;
            --surface: #ffffff;
            --surface-secondary: #fffbf7;
            --border: #e7e0d8;
            --border-light: #f5f0eb;
            --text-primary: #1c1410;
            --text-secondary: #57534e;
            --text-muted: #a8a29e;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
        }
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #faf5f0; }
        [v-cloak] { display: none; }

        /* 满宽 + 固定布局：各列按比例分配、铺满卡片(右侧不留白)，列宽固定不随内容忽宽忽窄、
           无大空隙。min-width 保证窄屏(820~880px)改横向滚动而不是把列挤变形。 */
        .data-table { font-size: 13px; border-collapse: collapse; width: 100%; table-layout: fixed; min-width: 880px; }
        .data-table th:nth-child(1), .data-table td:nth-child(1) { width: 8%; }   /* 企业ID */
        .data-table th:nth-child(2), .data-table td:nth-child(2) { width: 18%; overflow: hidden; text-overflow: ellipsis; }  /* 企业名称 */
        .data-table th:nth-child(3), .data-table td:nth-child(3) { width: 13%; }  /* 套餐到期 */
        .data-table th:nth-child(4), .data-table td:nth-child(4) { width: 9%; }   /* 客户信息 */
        .data-table th:nth-child(5), .data-table td:nth-child(5) { width: 14%; }  /* 最新更新日期 */
        .data-table th:nth-child(6), .data-table td:nth-child(6) { width: 12%; }  /* 账号密码 */
        .data-table th:nth-child(7), .data-table td:nth-child(7) { width: 26%; }  /* 操作 */
        .data-table th {
            background: #faf8f5; color: #78716c; font-weight: 600;
            text-align: left; padding: 10px 8px;
            border-bottom: 1px solid #ede8e2;
            font-size: 12px; letter-spacing: 0.02em; white-space: nowrap;
        }
        .data-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #f5f0eb;
            vertical-align: middle;
            white-space: nowrap;
        }
        .data-table tbody tr:nth-child(even) { background: #fdfbf9; }
        .data-table tbody tr:hover { background: #fff7ed; }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 8px;
            font-size: 14px; font-weight: 500;
            transition: all 0.2s ease; cursor: pointer;
            border: none; outline: none;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: #9a3412; }
        .btn-outline {
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-outline:hover { background: var(--surface-secondary); border-color: #cbd5e1; }

        .op-btn { display: inline-flex; align-items: center; padding: 5px 11px; font-size: 12px; font-weight: 500; border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: all 0.15s ease; line-height: 1; white-space: nowrap; background: #f3f4f6; color: #4b5563; }
        .op-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.10); }
        .op-btn.orange { background: #fff7ed; color: #ea580c; }

        .status-select {
            border: 1px solid var(--border); border-radius: 6px;
            padding: 4px 8px; font-size: 12px; outline: none;
            background: #fff; cursor: pointer; color: var(--text-secondary);
        }
        .status-select:focus { border-color: var(--primary-light); }
        .status-badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .status-ok { background: #ecfdf5; color: #059669; }
        .status-wait { background: #fffbeb; color: #d97706; }
        .status-no { background: #f3f4f6; color: #6b7280; }
        .status-blank { background: #f9fafb; color: #d1d5db; }

        .editable-cell { cursor: pointer; border-radius: 6px; padding: 2px 6px; margin: -2px -6px; }
        .editable-cell:hover { background: #fff7ed; }
        .edit-input {
            border: 1px solid var(--primary-light); border-radius: 6px;
            padding: 3px 6px; font-size: 13px; outline: none; width: 130px;
        }

        @media (max-width: 640px) {
            .mobile-bar { flex-wrap: wrap !important; gap: 8px !important; }
            .mobile-search { width: 100% !important; }
            .mobile-search input { width: 100% !important; }
        }
        .cust-cards { display: none; }
        @media (max-width: 820px) {
            .cust-table-wrap { display: none; }
            .cust-cards { display: flex; flex-direction: column; gap: 12px; padding: 14px; }
        }
        .onboard-layout { display: flex; gap: 16px; align-items: flex-start; }
        .onboard-sidebar { width: 168px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; }
        .onboard-sidebar-item {
            padding: 9px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; color: #57534e;
        }
        .onboard-sidebar-item:hover { background: #faf7f4; }
        .onboard-sidebar-item.active { background: #fff7ed; color: #c2410c; font-weight: 600; }
        .onboard-content { flex: 1; min-width: 0; }
        @media (max-width: 820px) {
            .onboard-layout { flex-direction: column; }
            .onboard-sidebar { width: 100%; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
            .onboard-sidebar-item { flex-shrink: 0; white-space: nowrap; }
        }
        .cust-card { border: 1px solid #f0ece8; border-radius: 14px; padding: 16px; background: #fff; }
        .cc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
        .cc-name { font-size: 16px; font-weight: 700; color: #1c1410; line-height: 1.3; }
        .cc-no { font-size: 12px; color: #9ca3af; background: #f7f5f3; padding: 3px 9px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; }
        .cc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 14px; margin-bottom: 14px; }
        .cc-item .k { font-size: 11px; color: #9ca3af; margin-bottom: 3px; }
        .cc-item .vv { font-size: 13.5px; color: #374151; font-weight: 500; }
        .cc-ops { display: flex; flex-wrap: wrap; gap: 7px; padding-top: 13px; border-top: 1px solid #f3f0ec; }
    </style>
</head>
<body class="min-h-screen">
<div id="app" v-cloak>
    <div v-if="noPermission" class="min-h-screen flex items-center justify-center">
        <div class="text-center">
            <h2 class="text-xl font-semibold text-gray-800 mb-2">无访问权限</h2>
            <p class="text-gray-500 mb-6">仅超级管理员可访问此页面</p>
            <a href="/insurance" class="btn btn-primary">返回首页</a>
        </div>
    </div>

    <template v-if="!noPermission && ready">
        <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <span class="font-semibold text-gray-800">午虎AI保单台账</span>
                <span style="display:inline-flex;align-items:center;gap:4px;background:#dc2626;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(220,38,38,0.35);letter-spacing:0.5px;">
                    <svg style="width:15px;height:15px;flex-shrink:0;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                    内部管理界面
                </span>
                <a href="/insurance" class="hidden sm:inline text-sm text-gray-500 hover:text-orange-600">首页（台账记录）</a>
                <a href="/admin/customers" class="hidden sm:inline text-sm text-orange-600 font-medium">客户管理</a>
            </div>
            <div class="flex items-center space-x-4">
                <div class="hidden sm:flex items-center space-x-4">
                    <span class="text-sm text-gray-500">{{ currentUser.name || currentUser.phone }}</span>
                    <button @click="logout" class="text-sm text-gray-400 hover:text-red-500">退出</button>
                </div>
                <button @click="mobileMenuOpen = !mobileMenuOpen" class="sm:hidden p-2 rounded-lg text-gray-500 hover:bg-gray-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path v-if="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        <path v-else stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </nav>
        <div v-if="mobileMenuOpen" class="sm:hidden bg-white border-b border-gray-200 px-4 py-3 space-y-2">
            <a href="/insurance" class="block text-sm text-gray-600 py-2">首页（台账记录）</a>
            <a href="/admin/customers" class="block text-sm text-orange-600 font-medium py-2">客户管理</a>
            <hr class="border-gray-100">
            <div class="flex items-center justify-between py-2">
                <span class="text-sm text-gray-500">{{ currentUser.name || currentUser.phone }}</span>
                <button @click="logout" class="text-sm text-red-500">退出</button>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-6">
            <div class="mobile-bar flex items-center justify-between mb-5">
                <div class="flex items-center gap-3" style="flex-wrap:wrap;">
                    <h1 class="text-lg font-semibold text-gray-800">客户管理</h1>
                    <div class="mobile-search" style="position:relative;">
                        <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:#9ca3af;pointer-events:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/>
                        </svg>
                        <input v-model="custSearch" type="text" placeholder="搜索企业名称/联系人…"
                            style="height:34px;padding:0 10px 0 32px;border:1px solid #e7e0d8;border-radius:8px;font-size:13px;outline:none;width:220px;transition:border-color 0.2s;"
                            @focus="$event.target.style.borderColor='#ea580c'" @blur="$event.target.style.borderColor='#e7e0d8'">
                    </div>
                </div>
                <div style="display:flex;gap:8px;align-items:center;">
                    <span class="text-sm text-gray-400" style="margin-right:4px;">共 {{ filteredCustomers.length }} 个客户</span>
                    <a href="/admin/users?role=super_admin" class="btn btn-outline" style="font-size:13px;color:#7c3aed;border-color:#c4b5fd;text-decoration:none;">内部账号</a>
                    <a href="/admin/users?enterprise_id=__none__" class="btn btn-outline" style="font-size:13px;color:#374151;border-color:#e7e0d8;text-decoration:none;">未分组账号</a>
                    <button @click="openCreateModal" class="btn btn-primary">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        添加企业
                    </button>
                </div>
            </div>

            <div v-if="loading" class="text-center py-16 text-gray-400">加载中…</div>
            <template v-else>
            <div class="onboard-layout">
                <!-- 左侧接入时间分组导航 -->
                <div class="onboard-sidebar">
                    <div v-for="g in sidebarGroups" :key="g.key" class="onboard-sidebar-item" :class="{active: activeGroup === g.key}" @click="activeGroup = g.key">
                        <span>{{ g.label }}</span>
                        <span>{{ g.count }}</span>
                    </div>
                </div>

                <div class="onboard-content">
                <!-- 客服跟进手册：复用使用手册的富文本页(manual.html ?doc=cs_followup)，iframe 内嵌 -->
                <div v-if="activeGroup === 'manual'" style="padding:0;">
                    <iframe src="/help?doc=cs_followup" style="width:100%;height:calc(100vh - 170px);min-height:560px;border:none;border-radius:12px;background:#fff;" title="客服跟进手册"></iframe>
                </div>
                <template v-else>
                <!-- 桌面表格 -->
                <div class="cust-table-wrap bg-white rounded-2xl border border-gray-100 overflow-x-auto">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>企业ID</th>
                                <th>企业名称</th>
                                <th>套餐到期</th>
                                <th>客户信息</th>
                                <th>最新更新日期</th>
                                <th>账号密码</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="c in displayedCustomers" :key="c.id">
                                <td class="text-gray-400">{{ c.enterprise_no || '-' }}</td>
                                <td class="font-medium text-gray-800">{{ c.name }}</td>
                                <td>
                                    <template v-if="planExpiryStr(c)">
                                        <div style="font-size:13px;font-weight:600;"
                                            :style="{color: planDaysLeft(c) <= 0 ? '#dc2626' : planDaysLeft(c) <= 7 ? '#d97706' : '#059669'}">
                                            {{ planDaysLeft(c) <= 0 ? '已到期' : planDaysLeft(c) + ' 天后到期' }}
                                        </div>
                                        <div style="font-size:12px;color:#9ca3af;margin-top:2px;">{{ planExpiryStr(c) }}</div>
                                    </template>
                                    <span v-else style="font-size:12px;color:#d1d5db;">未设置</span>
                                    <template v-if="c.next_plan_type">
                                        <div style="margin-top:6px;padding-top:6px;border-top:1px dashed #e5e7eb;font-size:11px;color:#9ca3af;">
                                            续费 {{ nextPlanExpiryStr(c) }} 起生效
                                        </div>
                                    </template>
                                </td>
                                <td>
                                    <button class="op-btn" @click="openProfile(c)">客户档案</button>
                                </td>
                                <td class="text-gray-400" style="font-size:12px;white-space:nowrap;">{{ c.profile_updated_at ? formatTime(c.profile_updated_at) : '—' }}</td>
                                <td>
                                    <template v-if="c.admin_password">
                                        <div style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:600;color:#1c1410;letter-spacing:0.5px;user-select:all;">{{ c.admin_password }}</div>
                                        <div style="font-size:11px;color:#9ca3af;margin-top:2px;">账号 {{ c.admin_account }}</div>
                                    </template>
                                    <span v-else style="font-size:12px;color:#d1d5db;" title="该账号未存明文密码，覆盖为随机密码后即显示">—</span>
                                </td>
                                <td>
                                    <button class="op-btn orange" @click="gotoManage(c)">客户系统配置</button>
                                    <button class="op-btn" @click="openEditModal(c)">编辑</button>
                                    <button class="op-btn" style="background:#fef2f2;color:#dc2626;" @click="confirmDelete(c)">删除</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 移动端卡片 -->
                <div class="cust-cards">
                    <div class="cust-card" v-for="c in displayedCustomers" :key="'m'+c.id">
                        <div class="cc-head">
                            <div class="cc-name">{{ c.name }}</div>
                            <div class="cc-no">{{ c.enterprise_no || '-' }}</div>
                        </div>
                        <div class="cc-grid">
                            <div class="cc-item"><div class="k">套餐到期</div><div class="vv">
                                <template v-if="planExpiryStr(c)">
                                    <span :style="{color: planDaysLeft(c) <= 0 ? '#dc2626' : planDaysLeft(c) <= 7 ? '#d97706' : '#059669', fontWeight:600}">{{ planDaysLeft(c) <= 0 ? '已到期' : planDaysLeft(c) + ' 天后到期' }}</span>
                                    <span style="color:#9ca3af;margin-left:4px;">{{ planExpiryStr(c) }}</span>
                                </template>
                                <span v-else style="color:#d1d5db;">未设置</span>
                            </div></div>
                            <div class="cc-item"><div class="k">最新更新日期</div><div class="vv">{{ c.profile_updated_at ? formatTime(c.profile_updated_at) : '—' }}</div></div>
                            <div class="cc-item"><div class="k">账号密码</div><div class="vv">
                                <template v-if="c.admin_password">
                                    <span style="font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;color:#1c1410;letter-spacing:0.5px;user-select:all;">{{ c.admin_password }}</span>
                                    <span style="color:#9ca3af;margin-left:4px;">账号 {{ c.admin_account }}</span>
                                </template>
                                <span v-else style="color:#d1d5db;">—</span>
                            </div></div>
                        </div>
                        <div class="cc-ops">
                            <button class="op-btn orange" @click="gotoManage(c)">客户系统配置</button>
                            <button class="op-btn" @click="openProfile(c)">客户档案</button>
                            <button class="op-btn" @click="openEditModal(c)">编辑</button>
                            <button class="op-btn" style="background:#fef2f2;color:#dc2626;" @click="confirmDelete(c)">删除</button>
                        </div>
                    </div>
                </div>
                </template>
                </div>
            </div>
            </template>
        </div>

        <!-- 客户档案弹窗：只读展示基础信息 + 可编辑备注(跟进记录) -->
        <div v-if="profileTarget" class="modal-mask" @click.self="closeProfile" style="position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:60;">
            <div style="background:#fff;border-radius:12px;padding:24px;width:440px;max-height:82vh;overflow-y:auto;">
                <h3 style="font-size:16px;font-weight:700;color:#1c1410;margin-bottom:16px;">{{ profileTarget.name }} · 客户档案</h3>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-bottom:16px;font-size:13px;">
                    <div><div style="color:#9ca3af;font-size:11px;margin-bottom:3px;">企业ID</div><div>{{ profileTarget.enterprise_no || '-' }}</div></div>
                    <div><div style="color:#9ca3af;font-size:11px;margin-bottom:3px;">跟进状态</div><div>
                        <select class="status-select" :value="profileTarget.follow_status || ''" @change="updateStatus(profileTarget, $event.target.value)">
                            <option value="">未标记</option>
                            <option value="正常使用">正常使用</option>
                            <option value="待使用">待使用</option>
                            <option value="无使用（体量太小）">无使用（体量太小）</option>
                            <option value="暂不需要">暂不需要</option>
                        </select>
                    </div></div>
                    <div><div style="color:#9ca3af;font-size:11px;margin-bottom:3px;">企业联系人</div><div>{{ profileTarget.contact_person || '未填' }}</div></div>
                    <div><div style="color:#9ca3af;font-size:11px;margin-bottom:3px;">负责人联系电话</div><div>{{ profileTarget.contact_phone || '未填' }}</div></div>
                    <div><div style="color:#9ca3af;font-size:11px;margin-bottom:3px;">推荐人</div><div>{{ profileTarget.referrer_name || '无' }}</div></div>
                    <div><div style="color:#9ca3af;font-size:11px;margin-bottom:3px;">接入时间</div><div>{{ (profileTarget.follow_status === '正常使用' && profileTarget.onboarded_at) ? formatTime(profileTarget.onboarded_at) : '未接入' }}</div></div>
                </div>
                <div style="font-size:12px;color:#6b7280;margin-bottom:6px;">跟进记录</div>
                <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px;">
                    <thead>
                        <tr>
                            <th style="text-align:left;padding:6px 8px;border-bottom:1px solid #e7e0d8;color:#78716c;font-size:12px;font-weight:600;white-space:nowrap;">跟进日期</th>
                            <th style="text-align:left;padding:6px 8px;border-bottom:1px solid #e7e0d8;color:#78716c;font-size:12px;font-weight:600;">跟进情况</th>
                            <th style="width:22px;border-bottom:1px solid #e7e0d8;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(f, idx) in profileFollowups" :key="idx">
                            <td style="padding:6px 8px;border-bottom:1px solid #f5f0eb;white-space:nowrap;color:#57534e;vertical-align:top;">{{ f.date }}</td>
                            <td style="padding:6px 8px;border-bottom:1px solid #f5f0eb;color:#57534e;word-break:break-all;">{{ f.content }}</td>
                            <td style="padding:6px 8px;border-bottom:1px solid #f5f0eb;text-align:center;vertical-align:top;">
                                <span style="cursor:pointer;color:#dc2626;font-size:14px;" @click="profileFollowups.splice(idx,1)">×</span>
                            </td>
                        </tr>
                        <tr v-if="!profileFollowups.length">
                            <td colspan="3" style="padding:14px 8px;text-align:center;color:#9ca3af;">暂无跟进记录</td>
                        </tr>
                    </tbody>
                </table>
                <div style="display:flex;gap:8px;">
                    <input type="date" v-model="newFollowupDate"

                    <input v-model="editForm.onboarded_at" type="date" style="width:100%;height:38px;border:1px solid #e7e0d8;border-radius:8px;padding:0 12px;font-size:14px;outline:none;">

                <div style="margin-bottom:16px;">
                    <label style="display:block;font-size:12px;color:#6b7280;margin-bottom:5px;">推荐人（输入姓名/手机号搜索）</label>
                    <input v-model="editReferrerSearch" @input="searchEditReferrer" placeholder="输入姓名或手机号…"
                           style="width:100%;height:38px;border:1px solid #e7e0d8;border-radius:8px;padding:0 12px;font-size:14px;outline:none;margin-bottom:6px;">
                    <div v-if="editReferrerList.length" style="border:1px solid #e7e0d8;border-radius:8px;max-height:160px;overflow-y:auto;">
                        <div v-for="u in editReferrerList" :key="u.id" @click="selectEditReferrer(u)"
                             :style="{padding:'8px 12px',cursor:'pointer',fontSize:'13px',display:'flex',justifyContent:'space-between',alignItems:'center',background: editReferrerSelected && editReferrerSelected.id===u.id ? '#fff7ed' : ''}">
                            <span>{{ u.name || u.phone }}</span>
                            <span style="font-size:11px;color:#9ca3af;">{{ u.phone }}</span>

                    </div>
                    <div v-if="editReferrerSelected" style="margin-top:6px;padding:7px 10px;background:#fff7ed;border-radius:8px;font-size:13px;color:#92400e;">
                        已选：{{ editReferrerSelected.name || editReferrerSelected.phone }}
                        <button @click="editReferrerSelected=null" style="margin-left:8px;color:#9ca3af;background:none;border:none;cursor:pointer;">✕ 清除</button>
                    </div>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:8px;">
                    <button class="btn btn-outline" @click="closeEditModal">取消</button>
                    <button class="btn btn-primary" :disabled="editSubmitting" @click="submitEditModal">{{ editSubmitting ? '保存中…' : '确定' }}</button>
                </div>
            </div>
        </div>

        <!-- 添加企业弹窗 -->
        <div v-if="createVisible" class="modal-mask" @click.self="closeCreateModal" style="position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:60;">
            <div style="background:#fff;border-radius:12px;padding:24px;width:min(420px, calc(100vw - 32px));">
                <h3 style="font-size:16px;font-weight:700;color:#1c1410;margin-bottom:16px;">添加企业</h3>
                <div v-if="createFormError" style="background:#fef2f2;color:#dc2626;font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:12px;">{{ createFormError }}</div>
                <div style="margin-bottom:12px;">
                    <label style="display:block;font-size:12px;color:#6b7280;margin-bottom:5px;">企业名称 <span style="color:#dc2626;">*</span></label>
                    <input v-model="createForm.name" type="text" style="width:100%;height:38px;border:1px solid #e7e0d8;border-radius:8px;padding:0 12px;font-size:14px;outline:none;">
                </div>
                <div style="margin-bottom:12px;">
                    <label style="display:block;font-size:12px;color:#6b7280;margin-bottom:5px;">企业编号 <span style="color:#dc2626;">*</span></label>
                    <input v-model="createForm.enterprise_no" type="text" style="width:100%;height:38px;border:1px solid #e7e0d8;border-radius:8px;padding:0 12px;font-size:14px;outline:none;">
                    <p style="font-size:12px;color:#9ca3af;margin-top:4px;line-height:1.5;">添加后将自动创建该企业管理员账号：<br>账号为企业编号（小写、去掉横线），初始密码 <span style="color:#ea580c;font-weight:600;">wuhu2025</span></p>
                </div>
                <div style="margin-bottom:12px;">
                    <label style="display:block;font-size:12px;color:#6b7280;margin-bottom:5px;">联系人</label>
                    <input v-model="createForm.contact_person" type="text" style="width:100%;height:38px;border:1px solid #e7e0d8;border-radius:8px;padding:0 12px;font-size:14px;outline:none;">
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block;font-size:12px;color:#6b7280;margin-bottom:5px;">联系电话</label>
                    <input v-model="createForm.contact_phone" type="text" style="width:100%;height:38px;border:1px solid #e7e0d8;border-radius:8px;padding:0 12px;font-size:14px;outline:none;">
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block;font-size:12px;color:#6b7280;margin-bottom:5px;">推荐人（输入姓名/手机号搜索）</label>
                    <input v-model="createReferrerSearch" @input="searchCreateReferrer" placeholder="输入姓名或手机号…"
                           style="width:100%;height:38px;border:1px solid #e7e0d8;border-radius:8px;padding:0 12px;font-size:14px;outline:none;margin-bottom:6px;">
                    <div v-if="createReferrerList.length" style="border:1px solid #e7e0d8;border-radius:8px;max-height:160px;overflow-y:auto;">
                        <div v-for="u in createReferrerList" :key="u.id" @click="selectCreateReferrer(u)"
                             :style="{padding:'8px 12px',cursor:'pointer',fontSize:'13px',display:'flex',justifyContent:'space-between',alignItems:'center',background: createReferrerSelected && createReferrerSelected.id===u.id ? '#fff7ed' : ''}">
                            <span>{{ u.name || u.phone }}</span>
                            <span style="font-size:11px;color:#9ca3af;">{{ u.phone }}</span>
                        </div>
                    </div>
                    <div v-if="createReferrerSelected" style="margin-top:6px;padding:7px 10px;background:#fff7ed;border-radius:8px;font-size:13px;color:#92400e;">
                        已选：{{ createReferrerSelected.name || createReferrerSelected.phone }}
                        <button @click="createReferrerSelected=null" style="margin-left:8px;color:#9ca3af;background:none;border:none;cursor:pointer;">✕ 清除</button>
                    </div>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:8px;">
                    <button class="btn btn-outline" @click="closeCreateModal">取消</button>
                    <button class="btn btn-primary" :disabled="createSubmitting" @click="submitCreateModal">{{ createSubmitting ? '提交中…' : '确定' }}</button>
                </div>
            </div>
        </div>
    </template>
</div>

<script>
const { createApp, ref, onMounted } = Vue;

function getToken() { return localStorage.getItem('token'); }
function getUser() { try { return JSON.parse(localStorage.getItem('user')); } catch { return null; } }
function doLogout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = '/login'; }

// 按正式接入时间(onboarded_at)分组：第一周/第二周/3-6周/试用结束(超过6周)
// 跟进状态不是"正常使用"的（待使用/未标记/无使用/预备群等）一律归入"暂未接入"，不参与按周分组
const ONBOARD_GROUPS = [
    { key: 'week1', label: '接入第一周', test: d => d >= 0 && d < 7 },
    { key: 'week2', label: '接入第二周', test: d => d >= 7 && d < 14 },
    { key: 'week3to6', label: '接入3-6周', test: d => d >= 14 && d < 42 },
    { key: 'week6trial', label: '接入满6周(试用中)', test: d => d >= 42 },              // 接入满6周、套餐未到期
    { key: 'trialEnded', label: '试用结束', test: () => false },                        // 套餐已到期(下方分组应用里按套餐到期单独判)
];
function daysSinceOnboard(onboardedAt) {
    if (!onboardedAt) return null;
    const d = new Date(onboardedAt.replace(' ', 'T'));
    if (isNaN(d.getTime())) return null;
    return Math.floor((Date.now() - d.getTime()) / 86400000);
}
async function authFetch(url, options = {}) {
    const headers = { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json', ...(options.headers || {}) };
    const resp = await fetch(url, { ...options, headers });
    if (resp.status === 401) { doLogout(); throw new Error('未登录'); }
    return resp;
}

createApp({
    setup() {
        const ready = ref(false);
        const noPermission = ref(false);
        const currentUser = ref({});
        const loading = ref(false);
        const customers = ref([]);
        const custSearch = ref('');
        const mobileMenuOpen = ref(false);

        const filteredCustomers = Vue.computed(() => {
            const q = custSearch.value.trim().toLowerCase();
            if (!q) return customers.value;
            return customers.value.filter(c =>
                (c.name || '').toLowerCase().includes(q) ||
                (c.contact_person || '').toLowerCase().includes(q)
            );
        });

        const activeGroup = ref('all');

        const groupedCustomers = Vue.computed(() => {
            const groups = ONBOARD_GROUPS.map(g => ({ ...g, items: [] }));
            const prepQunGroup = { key: 'prepQun', label: '预备群', items: [] };   // 客户名以「预备群」开头
            const notOnboardGroup = { key: 'prep', label: '暂未接入', items: [] };
            const noNeedGroup = { key: 'noNeed', label: '暂不需要', items: [] };   // 跟进状态=暂不需要，单独成组
            filteredCustomers.value.forEach(c => {
                // 预备群优先：客户名以「预备群」开头的单独成组，不参与其它分组
                if ((c.name || '').startsWith('预备群')) { prepQunGroup.items.push(c); return; }
                // 跟进状态「暂不需要」单独成组（放在暂未接入下面），不再混入暂未接入
                if (c.follow_status === '暂不需要') { noNeedGroup.items.push(c); return; }
                if (c.follow_status !== '正常使用') { notOnboardGroup.items.push(c); return; }
                const d = daysSinceOnboard(c.onboarded_at);
                if (d === null) return;
                // 套餐已到期 → 试用结束；套餐未到期 → 按接入周数分（不受接入时长影响）
                let g;
                if (planDaysLeft(c) <= 0) {
                    g = groups.find(x => x.key === 'trialEnded');
                } else {
                    g = groups.find(x => x.key !== 'trialEnded' && x.test(d));
                }
                if (g) g.items.push(c);
            });
            // 顺序：各接入周分组 → 暂未接入 → 暂不需要 → 预备群
            groups.push(notOnboardGroup);
            groups.push(noNeedGroup);
            groups.push(prepQunGroup);
            return groups;
        });

        const sidebarGroups = Vue.computed(() => {
            const list = [{ key: 'all', label: '全部', count: filteredCustomers.value.length }];
            groupedCustomers.value.forEach(g => {
                list.push({ key: g.key, label: g.label, count: g.items.length });
            });
            // 「客服跟进手册」放最后（暂不筛选客户，内容以后再定）
            list.push({ key: 'manual', label: '客服跟进手册', count: '' });
            return list;
        });

        const displayedCustomers = Vue.computed(() => {
            if (activeGroup.value === 'all') return filteredCustomers.value;
            const g = groupedCustomers.value.find(g => g.key === activeGroup.value);
            return g ? g.items : [];
        });

        function checkAuth() {
            const token = getToken();
            if (!token) { doLogout(); return false; }
            const user = getUser();
            if (!user) { doLogout(); return false; }
            if (user.role !== 'super_admin') {
                noPermission.value = true;
                return false;
            }
            currentUser.value = user;
            return true;
        }

        function formatTime(t) {
            if (!t) return '-';
            return t.replace('T', ' ').substring(0, 16);
        }

        // 套餐到期计算（与企业管理页 admin_enterprises.html 逻辑一致）
        function planExpiry(c) {
            if (!c.plan_start_at) return null;
            const start = new Date(String(c.plan_start_at).replace(' ', 'T'));
            if (isNaN(start.getTime())) return null;
            const months = c.plan_months || (c.plan_type === 'trial' ? 2 : 1);
            const d = new Date(start);
            d.setMonth(d.getMonth() + months);
            return d;
        }
        function planDaysLeft(c) {
            const exp = planExpiry(c);
            if (!exp) return null;
            return Math.ceil((exp - Date.now()) / 86400000);
        }
        function planExpiryStr(c) {
            const exp = planExpiry(c);
            if (!exp || isNaN(exp.getTime())) return '';
            return exp.toISOString().slice(0, 10);
        }
        function nextPlanExpiryStr(c) {
            if (!c.next_plan_start_at) return '';
            return String(c.next_plan_start_at).slice(0, 10);
        }

        async function fetchCustomers() {
            loading.value = true;
            try {
                const resp = await authFetch('/api/auth/enterprises');
                const data = await resp.json();
                if (data.code === 0) {
                    // 预备群/测试账号不是真实客户，排到列表最后面（还是要展示，只是不占最上面的位置）
                    const all = data.data || [];
                    const isPrep = c => (c.name || '').startsWith('预备群') || c.name === '测试';
                    customers.value = [...all.filter(c => !isPrep(c)), ...all.filter(isPrep)];
                }
            } catch (e) {
                console.error('加载客户列表失败', e);
            } finally {
                loading.value = false;
            }
        }

        async function updateStatus(c, value) {
            const old = c.follow_status;
            c.follow_status = value;
            try {
                const resp = await authFetch(`/api/auth/enterprises/${c.id}`, {
                    method: 'PUT',
                    body: JSON.stringify({ follow_status: value }),
                });
                const data = await resp.json();
                if (data.code !== 0) {
                    c.follow_status = old;
                    alert(data.msg || '保存失败');
                } else {
                    if (data.data && data.data.onboarded_at) c.onboarded_at = data.data.onboarded_at;
                    if (data.data && data.data.profile_updated_at) c.profile_updated_at = data.data.profile_updated_at;
                }
            } catch (e) {
                c.follow_status = old;
                alert('网络错误');
            }
        }

        function gotoManage(c) {
            window.location.href = `/admin/enterprises?search=${encodeURIComponent(c.name || '')}`;
        }
        const editTarget = ref(null);
        const editForm = ref({ name: '', enterprise_no: '', contact_person: '', contact_phone: '', onboarded_at: '' });
        const editFormError = ref('');
        const editSubmitting = ref(false);
        const editReferrerSearch = ref('');
        const editReferrerList = ref([]);
        const editReferrerSelected = ref(null);
        let editReferrerTimer = null;
        function openEditModal(c) {
            editTarget.value = c;
            editForm.value = {
                name: c.name || '',
                enterprise_no: c.enterprise_no || '',
                contact_person: c.contact_person || '',
                contact_phone: c.contact_phone || '',
                onboarded_at: c.onboarded_at ? c.onboarded_at.slice(0, 10) : '',
            };
            editFormError.value = '';
            editReferrerSearch.value = '';
            editReferrerList.value = [];
            editReferrerSelected.value = c.referrer_id ? { id: c.referrer_id, name: c.referrer_name, phone: '' } : null;
        }
        function searchEditReferrer() {
            clearTimeout(editReferrerTimer);
            const q = editReferrerSearch.value.trim();
            if (!q) { editReferrerList.value = []; return; }
            editReferrerTimer = setTimeout(async () => {
                try {
                    const resp = await authFetch(`/api/auth/users?q=${encodeURIComponent(q)}&limit=10`);
                    const j = await resp.json();
                    if (j.code === 0) editReferrerList.value = j.data || [];
                } catch (e) {}
            }, 300);
        }
        function selectEditReferrer(u) { editReferrerSelected.value = u; }
        function closeEditModal() {
            editTarget.value = null;
        }
        async function submitEditModal() {
            if (!editTarget.value) return;
            if (!editForm.value.name.trim()) { editFormError.value = '请输入企业名称'; return; }
            if (!editForm.value.enterprise_no.trim()) { editFormError.value = '请输入企业编号'; return; }
            editSubmitting.value = true;
            try {
                const body = {
                    name: editForm.value.name.trim(),
                    enterprise_no: editForm.value.enterprise_no.trim(),
                    contact_person: editForm.value.contact_person.trim(),
                    contact_phone: editForm.value.contact_phone.trim(),
                };
                if (editForm.value.onboarded_at) {
                    body.onboarded_at = editForm.value.onboarded_at + ' 00:00:00';
                }
                const resp = await authFetch(`/api/auth/enterprises/${editTarget.value.id}`, {
                    method: 'PUT',
                    body: JSON.stringify(body),
                });
                const data = await resp.json();
                if (data.code !== 0) {
                    editFormError.value = data.msg || '保存失败';
                    editSubmitting.value = false;
                    return;
                }
                const refResp = await authFetch(`/api/auth/enterprises/${editTarget.value.id}/referrer`, {
                    method: 'PUT',
                    body: JSON.stringify({ referrer_id: editReferrerSelected.value ? editReferrerSelected.value.id : null }),
                });
                const refData = await refResp.json();
                if (refData.code !== 0) {
                    editFormError.value = refData.msg || '推荐人保存失败';
                    editSubmitting.value = false;
                    return;
                }
                Object.assign(editTarget.value, body, {
                    referrer_id: editReferrerSelected.value ? editReferrerSelected.value.id : null,
                    referrer_name: editReferrerSelected.value ? (editReferrerSelected.value.name || editReferrerSelected.value.phone) : '',
                    profile_updated_at: (data.data && data.data.profile_updated_at) || editTarget.value.profile_updated_at,
                });
                closeEditModal();
            } catch (e) {
                editFormError.value = '网络错误';
            } finally {
                editSubmitting.value = false;
            }
        }

        const createVisible = ref(false);
        const createForm = ref({ name: '', enterprise_no: '', contact_person: '', contact_phone: '' });
        const createFormError = ref('');
        const createSubmitting = ref(false);
        const createReferrerSearch = ref('');
        const createReferrerList = ref([]);
        const createReferrerSelected = ref(null);
        let createReferrerTimer = null;
        function openCreateModal() {
            createForm.value = { name: '', enterprise_no: '', contact_person: '', contact_phone: '' };
            createFormError.value = '';
            createReferrerSearch.value = '';
            createReferrerList.value = [];
            createReferrerSelected.value = null;
            createVisible.value = true;
        }
        function closeCreateModal() {
            createVisible.value = false;
        }
        function searchCreateReferrer() {
            clearTimeout(createReferrerTimer);
            const q = createReferrerSearch.value.trim();
            if (!q) { createReferrerList.value = []; return; }
            createReferrerTimer = setTimeout(async () => {
                try {
                    const resp = await authFetch(`/api/auth/users?q=${encodeURIComponent(q)}&limit=10`);
                    const j = await resp.json();
                    if (j.code === 0) createReferrerList.value = j.data || [];
                } catch (e) {}
            }, 300);
        }
        function selectCreateReferrer(u) { createReferrerSelected.value = u; }
        async function submitCreateModal() {
            if (!createForm.value.name.trim()) { createFormError.value = '请输入企业名称'; return; }
            if (!createForm.value.enterprise_no.trim()) { createFormError.value = '请输入企业编号'; return; }
            createSubmitting.value = true;
            try {
                const body = {
                    name: createForm.value.name.trim(),
                    enterprise_no: createForm.value.enterprise_no.trim(),
                    contact_person: createForm.value.contact_person.trim(),
                    contact_phone: createForm.value.contact_phone.trim(),
                    referrer_id: createReferrerSelected.value ? createReferrerSelected.value.id : null,
                };
                const resp = await authFetch('/api/auth/enterprises', {
                    method: 'POST',
                    body: JSON.stringify(body),
                });
                const data = await resp.json();
                if (data.code !== 0) {
                    createFormError.value = data.msg || '添加失败';
                    createSubmitting.value = false;
                    return;
                }
                closeCreateModal();
                fetchCustomers();
            } catch (e) {
                createFormError.value = '网络错误';
            } finally {
                createSubmitting.value = false;
            }
        }

        const deleteTarget = ref(null);
        const deleting = ref(false);
        function confirmDelete(c) {
            deleteTarget.value = c;
        }
        async function doDelete() {
            if (!deleteTarget.value) return;
            deleting.value = true;
            try {
                const resp = await authFetch('/api/auth/enterprises/' + deleteTarget.value.id, { method: 'DELETE' });
                const data = await resp.json();
                if (data.code === 0) {
                    customers.value = customers.value.filter(c => c.id !== deleteTarget.value.id);
                    deleteTarget.value = null;
                } else {
                    alert(data.msg || '删除失败');
                }
            } catch (e) {
                alert('网络错误');
            } finally {
                deleting.value = false;
            }
        }

        const profileTarget = ref(null);
        const profileFollowups = ref([]);
        const newFollowupDate = ref('');
        const newFollowupContent = ref('');
        const profileSaving = ref(false);
        function openProfile(c) {
            profileTarget.value = c;
            let list = [];
            try {
                list = c.remark ? JSON.parse(c.remark) : [];
                if (!Array.isArray(list)) list = [];
            } catch (e) { list = []; }
            profileFollowups.value = list;
            newFollowupDate.value = new Date().toISOString().slice(0, 10);
            newFollowupContent.value = '';
        }
        function closeProfile() {
            profileTarget.value = null;
        }
        function addFollowup() {
            const content = newFollowupContent.value.trim();
            if (!content) return;
            profileFollowups.value.unshift({ date: newFollowupDate.value || new Date().toISOString().slice(0, 10), content });
            newFollowupContent.value = '';
        }
        async function saveProfile() {
            if (!profileTarget.value) return;
            // 用户在输入框填了内容但没点「+添加」就直接点保存 → 自动并入，避免跟进记录丢失（保存成空 []）
            if (newFollowupContent.value.trim()) addFollowup();
            profileSaving.value = true;
            const remarkJson = JSON.stringify(profileFollowups.value);
            try {
                const resp = await authFetch(`/api/auth/enterprises/${profileTarget.value.id}`, {
                    method: 'PUT',
                    body: JSON.stringify({ remark: remarkJson }),
                });
                const data = await resp.json();
                if (data.code === 0) {
                    profileTarget.value.remark = remarkJson;
                    if (data.data && data.data.profile_updated_at) profileTarget.value.profile_updated_at = data.data.profile_updated_at;
                    closeProfile();
                } else {
                    alert(data.msg || '保存失败');
                }
            } catch (e) {
                alert('网络错误');
            } finally {
                profileSaving.value = false;
            }
        }

        function logout() { doLogout(); }

        onMounted(() => {
            if (checkAuth()) {
                ready.value = true;
                fetchCustomers();
            }
        });

        return {
            ready, noPermission, currentUser, loading, customers, custSearch, filteredCustomers,
            activeGroup, groupedCustomers, sidebarGroups, displayedCustomers,
            mobileMenuOpen,
            formatTime, planExpiryStr, planDaysLeft, nextPlanExpiryStr, updateStatus, gotoManage, logout,
            profileTarget, profileFollowups, newFollowupDate, newFollowupContent, profileSaving,
            openProfile, closeProfile, saveProfile, addFollowup,
            deleteTarget, deleting, confirmDelete, doDelete,
            editTarget, editForm, editFormError, editSubmitting, openEditModal, closeEditModal, submitEditModal,
            editReferrerSearch, editReferrerList, editReferrerSelected, searchEditReferrer, selectEditReferrer,
            createVisible, createForm, createFormError, createSubmitting, openCreateModal, closeCreateModal, submitCreateModal,
            createReferrerSearch, createReferrerList, createReferrerSelected, searchCreateReferrer, selectCreateReferrer,
        };
    }
}).mount('#app');
</script>
</body>
