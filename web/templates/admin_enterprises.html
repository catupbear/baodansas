{% raw %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业管理 - AI保单台账系统</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c2410c;
            --primary-light: #ea580c;
            --primary-bg: #fff7ed;
            --surface: #ffffff;
            --surface-secondary: #fffbf7;
            --border: #e7e0d8;
            --border-light: #f5f0eb;
            --text-primary: #1c1410;
            --text-secondary: #57534e;
            --text-muted: #a8a29e;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
        }
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #faf5f0; }
        [v-cloak] { display: none; }

        .fade-enter-active, .fade-leave-active { transition: opacity 0.2s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }

        .modal-mask {
            position: fixed; inset: 0;
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 50;
        }
        .modal-content {
            background: white; border-radius: 12px;
            padding: 24px; width: 420px;
            max-height: 80vh; overflow-y: auto;
        }

        .data-table { font-size: 13px; border-collapse: collapse; width: 100%; }
        .data-table th {
            background: #faf8f5; color: #57534e; font-weight: 500;
            text-align: left; padding: 10px 16px;
            border-bottom: 1px solid #e7e0d8;
        }
        .data-table td {
            padding: 10px 16px;
            border-bottom: 1px solid #f5f0eb;
        }
        .data-table tr:hover { background: #fffbf7; }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 8px;
            font-size: 14px; font-weight: 500;
            transition: all 0.2s ease; cursor: pointer;
            border: none; outline: none;
        }
        .btn:focus-visible { box-shadow: 0 0 0 3px rgba(234,88,12,0.3); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: #9a3412; }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
        .btn-outline {
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-outline:hover { background: var(--surface-secondary); border-color: #cbd5e1; }

        .badge {
            display: inline-flex; align-items: center;
            padding: 2px 8px; border-radius: 6px;
            font-size: 12px; font-weight: 500;
        }
        .badge-green { background: #ecfdf5; color: #059669; }
        .badge-gray { background: #f3f4f6; color: #6b7280; }

        .form-input {
            width: 100%; height: 40px; padding: 0 12px;
            border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: var(--primary-light); }
    </style>
</head>
<body class="min-h-screen">
<div id="app" v-cloak>
    <!-- 无权限提示 -->
    <div v-if="noPermission" class="min-h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="text-6xl mb-4">&#128274;</div>
            <h2 class="text-xl font-semibold text-gray-800 mb-2">无访问权限</h2>
            <p class="text-gray-500 mb-6">仅超级管理员可访问此页面</p>
            <a href="/" class="btn btn-primary">返回首页</a>
        </div>
    </div>

    <!-- 主内容 -->
    <template v-if="!noPermission && ready">
        <!-- 顶部导航栏 -->
        <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <span class="font-semibold text-gray-800">AI保单台账系统</span>
                <a href="/" class="text-sm text-gray-500 hover:text-orange-600">保单台账</a>
                <a href="/monitor-config" class="text-sm text-gray-500 hover:text-orange-600">监控配置</a>
                <a href="/admin/enterprises" class="text-sm text-orange-600 font-medium">企业管理</a>
                <a href="/admin/users" class="text-sm text-gray-500 hover:text-orange-600">账号管理</a>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-sm text-gray-500">{{ currentUser.name || currentUser.phone }}</span>
                <button @click="logout" class="text-sm text-gray-400 hover:text-red-500">退出</button>
            </div>
        </nav>

        <!-- 页面内容 -->
        <div class="max-w-6xl mx-auto px-6 py-6">
            <!-- 操作栏 -->
            <div class="flex items-center justify-between mb-5">
                <h1 class="text-lg font-semibold text-gray-800">企业管理</h1>
                <button @click="openCreateModal" class="btn btn-primary">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    添加企业
                </button>
            </div>

            <!-- 企业列表 -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <div v-if="loading" class="py-16 text-center text-gray-400 text-sm">加载中...</div>
                <div v-else-if="enterprises.length === 0" class="py-16 text-center text-gray-400 text-sm">暂无企业数据</div>
                <div v-else class="overflow-x-auto">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>企业名称</th>
                                <th>联系人</th>
                                <th>联系电话</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="ent in enterprises" :key="ent.id">
                                <td class="font-medium text-gray-800">{{ ent.name }}</td>
                                <td>{{ ent.contact_person || '-' }}</td>
                                <td>{{ ent.contact_phone || '-' }}</td>
                                <td>
                                    <span class="badge" :class="ent.enabled ? 'badge-green' : 'badge-gray'">
                                        {{ ent.enabled ? '启用' : '禁用' }}
                                    </span>
                                </td>
                                <td class="text-gray-500">{{ formatTime(ent.created_at) }}</td>
                                <td>
                                    <div class="flex items-center gap-2">
                                        <button @click="openEditModal(ent)" class="btn btn-sm btn-outline">编辑</button>
                                        <button @click="toggleEnabled(ent)"
                                            class="btn btn-sm"
                                            :class="'btn-outline'"
                                            :style="ent.enabled ? 'color:#d97706;border-color:#fbbf24' : 'color:#059669;border-color:#6ee7b7'">
                                            {{ ent.enabled ? '禁用' : '启用' }}
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 创建/编辑企业弹窗 -->
        <transition name="fade">
            <div v-if="showModal" class="modal-mask" @click.self="closeModal">
                <div class="modal-content">
                    <h3 class="text-lg font-semibold text-gray-800 mb-5">{{ isEdit ? '编辑企业' : '添加企业' }}</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-500 mb-1">企业名称 <span class="text-red-500">*</span></label>
                            <input v-model="form.name" type="text" class="form-input" placeholder="请输入企业名称">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-500 mb-1">联系人</label>
                            <input v-model="form.contact_person" type="text" class="form-input" placeholder="请输入联系人">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-500 mb-1">联系电话</label>
                            <input v-model="form.contact_phone" type="text" class="form-input" placeholder="请输入联系电话">
                        </div>
                    </div>

                    <div v-if="formError" class="mt-4 bg-red-50 text-red-600 text-sm rounded-lg px-4 py-2">{{ formError }}</div>

                    <div class="flex justify-end gap-3 mt-6">
                        <button @click="closeModal" class="btn btn-outline">取消</button>
                        <button @click="submitForm" :disabled="submitting" class="btn btn-primary">
                            {{ submitting ? '提交中...' : '确定' }}
                        </button>
                    </div>
                </div>
            </div>
        </transition>

        <!-- 提示消息 -->
        <transition name="fade">
            <div v-if="toast" class="fixed top-4 right-4 z-50 bg-white shadow-lg rounded-lg px-5 py-3 text-sm flex items-center gap-2 border"
                :class="toast.type === 'success' ? 'border-green-200 text-green-700' : 'border-red-200 text-red-700'">
                <svg v-if="toast.type === 'success'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                <svg v-else class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                {{ toast.msg }}
            </div>
        </transition>
    </template>
</div>

<script>
const { createApp, ref, reactive, onMounted } = Vue;

function getToken() { return localStorage.getItem('token'); }
function getUser() { try { return JSON.parse(localStorage.getItem('user')); } catch { return null; } }
function doLogout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = '/login'; }
async function authFetch(url, options = {}) {
    const headers = { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json', ...(options.headers || {}) };
    const resp = await fetch(url, { ...options, headers });
    if (resp.status === 401) { doLogout(); throw new Error('未登录'); }
    return resp;
}

createApp({
    setup() {
        const ready = ref(false);
        const noPermission = ref(false);
        const currentUser = ref({});
        const loading = ref(false);
        const enterprises = ref([]);

        const showModal = ref(false);
        const isEdit = ref(false);
        const editId = ref(null);
        const form = reactive({ name: '', contact_person: '', contact_phone: '' });
        const formError = ref('');
        const submitting = ref(false);

        const toast = ref(null);
        let toastTimer = null;
        function showToast(msg, type = 'success') {
            toast.value = { msg, type };
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.value = null; }, 3000);
        }

        function checkAuth() {
            const token = getToken();
            if (!token) { doLogout(); return false; }
            const user = getUser();
            if (!user) { doLogout(); return false; }
            if (user.role !== 'super_admin') {
                noPermission.value = true;
                return false;
            }
            currentUser.value = user;
            return true;
        }

        function formatTime(t) {
            if (!t) return '-';
            return t.replace('T', ' ').substring(0, 19);
        }

        async function fetchEnterprises() {
            loading.value = true;
            try {
                const resp = await authFetch('/api/auth/enterprises');
                const data = await resp.json();
                if (data.code === 0) {
                    enterprises.value = data.data || [];
                } else {
                    showToast(data.msg || '获取企业列表失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            } finally {
                loading.value = false;
            }
        }

        function openCreateModal() {
            isEdit.value = false;
            editId.value = null;
            form.name = '';
            form.contact_person = '';
            form.contact_phone = '';
            formError.value = '';
            showModal.value = true;
        }

        function openEditModal(ent) {
            isEdit.value = true;
            editId.value = ent.id;
            form.name = ent.name || '';
            form.contact_person = ent.contact_person || '';
            form.contact_phone = ent.contact_phone || '';
            formError.value = '';
            showModal.value = true;
        }

        function closeModal() {
            showModal.value = false;
        }

        async function submitForm() {
            formError.value = '';
            if (!form.name.trim()) { formError.value = '请输入企业名称'; return; }
            submitting.value = true;
            try {
                let url, method;
                const body = {
                    name: form.name.trim(),
                    contact_person: form.contact_person.trim(),
                    contact_phone: form.contact_phone.trim(),
                };
                if (isEdit.value) {
                    url = '/api/auth/enterprises/' + editId.value;
                    method = 'PUT';
                } else {
                    url = '/api/auth/enterprises';
                    method = 'POST';
                }
                const resp = await authFetch(url, { method, body: JSON.stringify(body) });
                const data = await resp.json();
                if (data.code === 0) {
                    showToast(isEdit.value ? '企业已更新' : '企业已添加');
                    closeModal();
                    fetchEnterprises();
                } else {
                    formError.value = data.msg || '操作失败';
                }
            } catch (e) {
                formError.value = '网络错误';
            } finally {
                submitting.value = false;
            }
        }

        async function toggleEnabled(ent) {
            const newEnabled = !ent.enabled;
            const action = newEnabled ? '启用' : '禁用';
            try {
                const resp = await authFetch('/api/auth/enterprises/' + ent.id, {
                    method: 'PUT',
                    body: JSON.stringify({ enabled: newEnabled }),
                });
                const data = await resp.json();
                if (data.code === 0) {
                    showToast('已' + action + '企业「' + ent.name + '」');
                    fetchEnterprises();
                } else {
                    showToast(data.msg || action + '失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        function logout() { doLogout(); }

        onMounted(() => {
            if (checkAuth()) {
                ready.value = true;
                fetchEnterprises();
            }
        });

        return {
            ready, noPermission, currentUser, loading, enterprises,
            showModal, isEdit, form, formError, submitting,
            openCreateModal, openEditModal, closeModal, submitForm,
            toggleEnabled, logout, toast, formatTime,
        };
    }
}).mount('#app');
</script>
</body>
</html>{% endraw %}
