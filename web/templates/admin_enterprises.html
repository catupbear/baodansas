{% raw %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业管理 - 午虎AI保单台账</title>
    <script src="/static/vue.global.prod.js"></script>
    <link href="/static/tailwind.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #c2410c;
            --primary-light: #ea580c;
            --primary-bg: #fff7ed;
            --surface: #ffffff;
            --surface-secondary: #fffbf7;
            --border: #e7e0d8;
            --border-light: #f5f0eb;
            --text-primary: #1c1410;
            --text-secondary: #57534e;
            --text-muted: #a8a29e;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
        }
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #faf5f0; }
        [v-cloak] { display: none; }

        .fade-enter-active, .fade-leave-active { transition: opacity 0.2s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }

        .modal-mask {
            position: fixed; inset: 0;
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 50;
        }
        .modal-content {
            background: white; border-radius: 12px;
            padding: 24px; width: 420px;
            max-height: 80vh; overflow-y: auto;
        }

        .data-table { font-size: 13px; border-collapse: collapse; width: 100%; }
        .data-table th {
            background: #faf8f5; color: #78716c; font-weight: 600;
            text-align: left; padding: 10px 8px;
            border-bottom: 1px solid #ede8e2;
            font-size: 12px; letter-spacing: 0.02em; white-space: nowrap;
        }
        .data-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #f5f0eb;
            vertical-align: middle;
        }
        .data-table .btn-sm { padding: 4px 8px; }
        .data-table tbody tr:nth-child(even) { background: #fdfbf9; }
        .data-table tbody tr:hover { background: #fff7ed; }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 8px;
            font-size: 14px; font-weight: 500;
            transition: all 0.2s ease; cursor: pointer;
            border: none; outline: none;
        }
        .btn:focus-visible { box-shadow: 0 0 0 3px rgba(234,88,12,0.3); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: #9a3412; }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
        .btn-outline {
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-outline:hover { background: var(--surface-secondary); border-color: #cbd5e1; }

        .badge {
            display: inline-flex; align-items: center;
            padding: 3px 10px; border-radius: 999px;
            font-size: 12px; font-weight: 600;
        }
        .badge-green { background: #ecfdf5; color: #059669; }
        .badge-gray { background: #f3f4f6; color: #6b7280; }
        .badge-blue { background: #eff6ff; color: #3b82f6; }
        .badge-orange { background: #fff7ed; color: #ea580c; }
        .badge-purple { background: #f5f3ff; color: #7c3aed; }

        .quota-bar-wrap {
            width: 90px; background: #f3f4f6; border-radius: 4px;
            height: 5px; overflow: hidden;
        }
        .quota-bar-inner {
            height: 100%; border-radius: 4px;
            transition: width 0.4s ease;
        }
        .quota-label { font-size: 11px; color: #6b7280; margin-bottom: 2px; }

        .form-input {
            width: 100%; height: 40px; padding: 0 12px;
            border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: var(--primary-light); }

        /* 移动端适配 */
        @media (max-width: 640px) {
            .mobile-bar { flex-wrap: wrap !important; gap: 8px !important; }
            .mobile-bar > * { flex-shrink: 0; }
            .mobile-search { width: 100% !important; }
            .mobile-search input { width: 100% !important; }
            .modal-mask { align-items: flex-start; padding-top: 20px; }
            .modal-content { width: min(420px, calc(100vw - 32px)) !important; }
        }
        /* 操作列按钮统一美化：浅底 + 主题色，hover 微浮起 */
        .op-btn { display: inline-flex; align-items: center; padding: 5px 11px; font-size: 12px; font-weight: 500; border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: all 0.15s ease; line-height: 1; white-space: nowrap; background: #f3f4f6; color: #4b5563; }
        .op-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.10); }
        .op-btn.blue { background: #eff6ff; color: #2563eb; }
        .op-btn.orange { background: #fff7ed; color: #ea580c; }
        .op-btn.green { background: #ecfdf5; color: #059669; }
        .op-btn.amber { background: #fffbeb; color: #d97706; }
        .op-btn.purple { background: #f5f3ff; color: #7c3aed; }
        .op-btn.red { background: #fef2f2; color: #dc2626; }
        .op-btn.gray { background: #f3f4f6; color: #6b7280; }
        .op-btn.on { box-shadow: inset 0 0 0 1.5px currentColor; font-weight: 700; }
        /* AI质检小号滑动开关 */
        .ai-switch { position: relative; display: inline-block; width: 32px; height: 17px; flex-shrink: 0; cursor: pointer; }
        .ai-switch .slider { position: absolute; inset: 0; background: #d1d5db; border-radius: 999px; transition: background 0.2s; }
        .ai-switch .slider::before { content: ''; position: absolute; width: 13px; height: 13px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .ai-switch.on .slider { background: #059669; }
        .ai-switch.on.fix .slider { background: #dc2626; }
        .ai-switch.on .slider::before { transform: translateX(15px); }
        /* 质检范围条件：状态多选/保司标签 */
        .scope-status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .scope-status-item { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #374151; cursor: pointer; padding: 6px 8px; border: 1px solid #eee7e0; border-radius: 8px; }
        .scope-status-item.checked { background: #fff7ed; border-color: #fed7aa; color: #c2410c; font-weight: 600; }
        .scope-company-tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; background: #f5f3ff; color: #7c3aed; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .scope-company-tag button { background: none; border: none; color: #a78bda; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; }
        .scope-company-tag button:hover { color: #7c3aed; }
        /* 移动端企业卡片视图（窄屏替代横滑表格） */
        .ent-cards { display: none; }
        @media (max-width: 820px) {
            .ent-table-wrap { display: none; }
            .ent-cards { display: flex; flex-direction: column; gap: 12px; padding: 14px; }
        }
        .ent-card { border: 1px solid #f0ece8; border-radius: 14px; padding: 16px; background: #fff; }
        .ec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
        .ec-name { font-size: 16px; font-weight: 700; color: #1c1410; line-height: 1.3; }
        .ec-no { font-size: 12px; color: #9ca3af; background: #f7f5f3; padding: 3px 9px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; }
        .ec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 14px; margin-bottom: 14px; }
        .ec-item .k { font-size: 11px; color: #9ca3af; margin-bottom: 3px; }
        .ec-item .vv { font-size: 13.5px; color: #374151; font-weight: 500; }
        .ec-ops { display: flex; flex-wrap: wrap; gap: 7px; padding-top: 13px; border-top: 1px solid #f3f0ec; }
    </style>
</head>
<body class="min-h-screen">
<div id="app" v-cloak>
    <!-- 无权限提示 -->
    <div v-if="noPermission" class="min-h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="text-6xl mb-4">&#128274;</div>
            <h2 class="text-xl font-semibold text-gray-800 mb-2">无访问权限</h2>
            <p class="text-gray-500 mb-6">仅超级管理员可访问此页面</p>
            <a href="/insurance" class="btn btn-primary">返回首页</a>
        </div>
    </div>

    <!-- 主内容 -->
    <template v-if="!noPermission && ready">
        <!-- 顶部导航栏 -->
        <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <span class="font-semibold text-gray-800">午虎AI保单台账</span>
                <!-- 内部管理界面醒目标识（仅内部超级管理员可见；白色导航栏用红底白字变体） -->
                <span v-if="currentUser && currentUser.role === 'super_admin'" style="display:inline-flex;align-items:center;gap:4px;background:#dc2626;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(220,38,38,0.35);letter-spacing:0.5px;">
                    <svg style="width:15px;height:15px;flex-shrink:0;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                    内部管理界面
                </span>
                <a href="/insurance" class="hidden sm:inline text-sm text-gray-500 hover:text-orange-600">首页（台账记录）</a>
                <a href="/admin/customers" class="hidden sm:inline text-sm text-gray-500 hover:text-orange-600">客户管理</a>
                <a href="/admin/enterprises" class="hidden sm:inline text-sm text-orange-600 font-medium">客户系统配置</a>
            </div>
            <div class="flex items-center space-x-4">
                <div class="hidden sm:flex items-center space-x-4">
                    <span class="text-sm text-gray-500">{{ currentUser.name || currentUser.phone }}</span>
                    <button @click="logout" class="text-sm text-gray-400 hover:text-red-500">退出</button>
                </div>
                <!-- 汉堡菜单按钮（仅移动端） -->
                <button @click="mobileMenuOpen = !mobileMenuOpen" class="sm:hidden p-2 rounded-lg text-gray-500 hover:bg-gray-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path v-if="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        <path v-else stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </nav>
        <!-- 移动端菜单面板 -->
        <div v-if="mobileMenuOpen" class="sm:hidden bg-white border-b border-gray-200 px-4 py-3 space-y-2">
            <a href="/insurance" class="block text-sm text-gray-600 py-2">首页（台账记录）</a>
            <a href="/admin/customers" class="block text-sm text-gray-600 py-2">客户管理</a>
            <a href="/admin/enterprises" class="block text-sm text-gray-600 py-2">客户系统配置</a>
            <hr class="border-gray-100">
            <div class="flex items-center justify-between py-2">
                <span class="text-sm text-gray-500">{{ currentUser.name || currentUser.phone }}</span>
                <button @click="logout" class="text-sm text-red-500">退出</button>
            </div>
        </div>

        <!-- 页面内容 -->
        <div class="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-6">
            <!-- 操作栏 -->
            <div class="mobile-bar flex items-center justify-between mb-5">
                <div class="flex items-center gap-3" style="flex-wrap:wrap;">
                    <h1 class="text-lg font-semibold text-gray-800">企业管理</h1>
                    <div class="mobile-search" style="position:relative;">
                        <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:#9ca3af;pointer-events:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/>
                        </svg>
                        <input v-model="entSearch" type="text" placeholder="搜索企业名称…"
                            style="height:34px;padding:0 10px 0 32px;border:1px solid #e7e0d8;border-radius:8px;font-size:13px;outline:none;width:200px;transition:border-color 0.2s;"
                            @focus="$event.target.style.borderColor='#ea580c'" @blur="$event.target.style.borderColor='#e7e0d8'">
                    </div>
                </div>
                <div style="display:flex;gap:8px;align-items:center;">
                    <a href="/admin/customers" class="btn btn-outline" style="font-size:13px;color:#374151;border-color:#e7e0d8;text-decoration:none;">← 返回客户管理</a>
                </div>
            </div>

            <!-- 企业列表 -->
            <div class="bg-white rounded-xl shadow-sm" style="overflow:hidden;">
                <div v-if="loading" class="py-16 text-center text-gray-400 text-sm">加载中...</div>
                <div v-else-if="filteredEnterprises.length === 0" class="py-16 text-center text-gray-400 text-sm">{{ entSearch ? '无匹配结果' : '暂无企业数据' }}</div>
                <div v-else>
                    <div class="overflow-x-auto ent-table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="min-width:55px;text-align:center;">企业编号</th>
                                <th style="min-width:120px;">企业名称</th>
                                <th style="min-width:95px;">套餐</th>
                                <th style="min-width:110px;text-align:center;">本月识别量</th>
                                <th style="min-width:105px;text-align:center;">人员管理</th>
                                <th style="min-width:105px;text-align:center;">监控设置</th>
                                <th style="min-width:105px;text-align:center;">续保推送群</th>
                                <th style="min-width:170px;">AI质检</th>
                                                                <th style="min-width:50px;">状态</th>
                                <th style="min-width:90px;">创建时间</th>
                                <th style="min-width:150px;">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="ent in filteredEnterprises" :key="ent.id">
                                <!-- 企业编号 -->
                                <td style="text-align:center;color:#9ca3af;font-weight:600;">{{ ent.enterprise_no || '-' }}</td>
                                <!-- 企业名称 -->
                                <td style="font-weight:600;color:#1c1410;">{{ ent.name }}</td>

                                <!-- 套餐（类型 + 时长 + 到期） -->
                                <td>
                                    <!-- 当前套餐 -->
                                    <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                                        <template v-if="ent.plan_type">
                                            <span class="badge" style="white-space:nowrap;"
                                                :class="ent.plan_type==='enterprise' ? 'badge-blue' : ent.plan_type==='enterprise_trial' ? 'badge-purple' : 'badge-green'">
                                                {{ ent.plan_type==='enterprise' ? '企业版' : ent.plan_type==='enterprise_trial' ? '企业试用' : '标准版' }}
                                            </span>
                                            <span style="font-size:11px;color:#9ca3af;white-space:nowrap;">{{ ent.plan_months || 1 }}个月</span>
                                        </template>
                                        <span v-else class="badge" style="white-space:nowrap;background:#f3f4f6;color:#9ca3af;border:1px solid #e5e7eb;">未开通</span>
                                    </div>
                                    <!-- 下一个套餐（叠加续费）：仅显示类型+时长，到期日已移至客户管理页展示 -->
                                    <template v-if="ent.next_plan_type">
                                        <div style="display:flex;align-items:center;gap:4px;margin-top:4px;">
                                            <span style="font-size:10px;color:#9ca3af;">续费:</span>
                                            <span class="badge" style="font-size:10px;padding:1px 6px;"
                                                :class="ent.next_plan_type==='enterprise' ? 'badge-blue' : ent.next_plan_type==='enterprise_trial' ? 'badge-purple' : 'badge-green'">
                                                {{ ent.next_plan_type==='enterprise' ? '企业版' : ent.next_plan_type==='enterprise_trial' ? '企业试用' : '标准版' }}
                                            </span>
                                            <span style="font-size:10px;color:#9ca3af;">{{ ent.next_plan_months }}个月</span>
                                        </div>
                                    </template>
                                </td>

                                <!-- 本月识别量 -->
                                <td style="text-align:center;vertical-align:middle;">
                                    <span v-if="!ent.plan_type" style="font-size:12px;color:#9ca3af;">暂未开通套餐</span>
                                    <template v-else-if="ent.plan_type==='enterprise' || ent.plan_type==='enterprise_trial'">
                                        <span style="font-size:12px;color:#374151;">本月 {{ ent.monthly_pdf_usage }} 次</span>
                                    </template>
                                    <template v-else>
                                        <div style="display:flex;align-items:center;gap:8px;justify-content:center;">
                                            <div style="width:90px;">
                                                <div style="height:5px;background:#f0f0f0;border-radius:4px;overflow:hidden;">
                                                    <div :style="{
                                                        height:'100%', borderRadius:'4px',
                                                        width: Math.min(ent.monthly_pdf_usage/3000*100,100)+'%',
                                                        background: ent.monthly_pdf_usage>=2700?'#ef4444':ent.monthly_pdf_usage>=1800?'#f59e0b':'#10b981'
                                                    }"></div>
                                                </div>
                                            </div>
                                            <span style="font-size:12px;color:#374151;white-space:nowrap;">{{ ent.monthly_pdf_usage }} / 3000</span>
                                        </div>
                                    </template>
                                </td>

                                <!-- 人员管理 -->
                                <td style="vertical-align:middle;text-align:center;">
                                    <div style="display:inline-flex;align-items:center;gap:6px;">
                                        <button @click="gotoMembers(ent)" class="btn btn-sm btn-outline" style="padding:4px 10px;font-size:12px;color:#ea580c;border-color:#fed7aa;font-weight:600;white-space:nowrap;">人员管理</button>
                                        <span style="font-size:12px;color:#9ca3af;white-space:nowrap;">{{ ent.member_count || 0 }} 人</span>
                                    </div>
                                </td>
                                <!-- 监控设置 -->
                                <td style="vertical-align:middle;text-align:center;">
                                    <div style="display:inline-flex;align-items:center;gap:6px;">
                                        <button @click="gotoMonitor(ent)" class="btn btn-sm btn-outline" style="padding:4px 10px;font-size:12px;color:#ea580c;border-color:#fed7aa;font-weight:600;white-space:nowrap;">监控设置</button>
                                        <span style="font-size:12px;color:#9ca3af;white-space:nowrap;">{{ ent.monitor_count || 0 }} 个群</span>
                                    </div>
                                </td>
                                <!-- 续保推送群 -->
                                <td style="vertical-align:middle;text-align:center;">
                                    <div style="display:inline-flex;flex-direction:column;align-items:center;gap:3px;max-width:210px;">
                                        <button @click="openPushModal(ent)" class="btn btn-sm btn-outline" style="padding:4px 10px;font-size:12px;color:#2563eb;border-color:#bfdbfe;font-weight:600;white-space:nowrap;">推送群绑定</button>
                                        <span v-if="ent.renewal_push_count" style="font-size:11px;color:#6b7280;line-height:1.45;" :title="(ent.renewal_push_rooms||[]).join('、')">{{ (ent.renewal_push_rooms||[]).join('、') }}</span>
                                        <span v-else style="font-size:12px;color:#d1d5db;">未绑定</span>
                                    </div>
                                </td>

                                <!-- AI质检（仅超管；本页整体已限超管访问） -->
                                <td style="vertical-align:middle;">
                                    <div style="display:flex;flex-direction:column;gap:5px;min-width:160px;">
                                        <!-- 开关行：AI质检 / AI直接覆盖 -->
                                        <div style="display:flex;align-items:center;gap:12px;">
                                            <span style="display:inline-flex;align-items:center;gap:5px;" title="开启后该企业识别记录将自动送AI质检">
                                                <span class="ai-switch" :class="{on: aiOf(ent).config.enabled}" @click="toggleAiEnabled(ent)"><span class="slider"></span></span>
                                                <span style="font-size:11px;color:#6b7280;">质检</span>
                                            </span>
                                            <span style="display:inline-flex;align-items:center;gap:5px;" title="开启后AI发现差异直接覆盖系统数据（可还原）">
                                                <span class="ai-switch fix" :class="{on: aiOf(ent).config.auto_fix}" @click="toggleAiAutoFix(ent)"><span class="slider"></span></span>
                                                <span style="font-size:11px;color:#6b7280;">直接覆盖</span>
                                            </span>
                                        </div>
                                        <!-- 质检范围徽标 + 配置 -->
                                        <div style="display:flex;align-items:center;gap:6px;">
                                            <span class="badge" :class="aiOf(ent).config.scope.mode==='all' ? 'badge-blue' : 'badge-purple'" style="font-size:10px;padding:2px 8px;white-space:nowrap;">
                                                {{ aiOf(ent).config.scope.mode==='all' ? '全部' : '自定义·'+scopeCondCount(aiOf(ent).config.scope)+'条件' }}
                                            </span>
                                            <button @click="openScopeModal(ent)" class="op-btn gray" style="padding:2px 9px;font-size:11px;">配置</button>
                                        </div>
                                        <!-- 今日质检数 -->
                                        <div style="font-size:11px;color:#9ca3af;white-space:nowrap;">今日质检 {{ aiOf(ent).today_checked || 0 }} 单</div>
                                    </div>
                                </td>

                        <button v-for="opt in [{k:'7',l:'近一周'},{k:'lastmonth',l:'上月'},{k:'custom',l:'自定义'}]" :key="opt.k"
                            @click="reportRange=opt.k; reportLink=''"
                            :style="reportRange===opt.k ? 'flex:1;padding:8px;font-size:13px;background:#ea580c;color:#fff;border:1px solid #ea580c;border-radius:8px;cursor:pointer;' : 'flex:1;padding:8px;font-size:13px;background:#fff;color:#555;border:1px solid #e7e0d8;border-radius:8px;cursor:pointer;'">
                            {{ opt.l }}
                        </button>
                    </div>
                    <div v-if="reportRange==='custom'" style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">
                        <input type="date" v-model="reportStart" class="form-input" style="flex:1;">
                        <span style="color:#999;">~</span>
                        <input type="date" v-model="reportEnd" class="form-input" style="flex:1;">
                    </div>
                    <p style="font-size:12px;color:#999;margin-bottom:14px;">报告含：识别量汇总、每日识别趋势（折线图）。</p>
                    <div v-if="reportLink" style="margin-bottom:14px;">
                        <div style="font-size:13px;color:#16a34a;font-weight:600;margin-bottom:6px;">✅ 报告链接已生成</div>
                        <div style="display:flex;gap:8px;">
                            <input :value="reportLink" readonly class="form-input" style="flex:1;font-size:12px;" @focus="$event.target.select()">
                            <button @click="copyReportLink" class="btn btn-primary" style="white-space:nowrap;">{{ reportCopied ? '已复制 ✓' : '复制' }}</button>
                        </div>
                        <a :href="reportLink" target="_blank" style="display:inline-block;margin-top:8px;font-size:13px;color:#2563eb;">→ 直接打开查看</a>
                    </div>
                    <div class="flex justify-end gap-3 mt-2">
                        <button @click="showReportModal=false" class="btn btn-outline">关闭</button>
                        <button @click="doExportReport" class="btn btn-primary" style="padding:8px 20px;">生成报告链接</button>
                    </div>
                </div>
            </div>
        </transition>

        <!-- AI质检范围配置弹窗 -->
        <transition name="fade">
            <div v-if="showScopeModal" class="modal-mask" @click.self="showScopeModal=false">
                <div class="modal-content" style="width:min(460px, calc(100vw - 32px));">
                    <h3 class="text-lg font-semibold text-gray-800 mb-1">AI质检范围</h3>
                    <p style="font-size:13px;color:#9ca3af;margin-bottom:18px;">{{ scopeEnt ? scopeEnt.name : '' }}</p>

                    <!-- 全部 / 自定义 单选 -->
                    <div style="display:flex;gap:8px;margin-bottom:16px;">
                        <button type="button" @click="scopeForm.mode='all'"
                            :style="scopeForm.mode==='all' ? 'flex:1;padding:9px;font-size:13px;background:#ea580c;color:#fff;border:1px solid #ea580c;border-radius:8px;cursor:pointer;' : 'flex:1;padding:9px;font-size:13px;background:#fff;color:#555;border:1px solid #e7e0d8;border-radius:8px;cursor:pointer;'">
                            全部（每单都质检）
                        </button>
                        <button type="button" @click="scopeForm.mode='custom'"
                            :style="scopeForm.mode==='custom' ? 'flex:1;padding:9px;font-size:13px;background:#7c3aed;color:#fff;border:1px solid #7c3aed;border-radius:8px;cursor:pointer;' : 'flex:1;padding:9px;font-size:13px;background:#fff;color:#555;border:1px solid #e7e0d8;border-radius:8px;cursor:pointer;'">
                            自定义条件
                        </button>
                    </div>

                    <!-- 自定义条件区块（命中任一即质检） -->
                    <div v-if="scopeForm.mode==='custom'">
                        <p style="font-size:12px;color:#9ca3af;margin-bottom:14px;line-height:1.5;">满足以下任意一个条件的记录即触发AI质检。</p>

                        <!-- ① 按状态多选 -->
                        <div style="margin-bottom:18px;">
                            <div style="font-size:13px;color:#374151;font-weight:600;margin-bottom:8px;">① 按状态</div>
                            <div class="scope-status-grid">
                                <label v-for="st in STATUS_OPTIONS" :key="st"
                                    class="scope-status-item" :class="{checked: scopeForm.statuses.includes(st)}">
                                    <input type="checkbox" :checked="scopeForm.statuses.includes(st)" @change="toggleScopeStatus(st)" style="accent-color:#c2410c;">
                                    {{ st }}
                                </label>
                            </div>
                        </div>

                        <!-- ② 按保司多选（标签输入） -->
                        <div style="margin-bottom:18px;">
                            <div style="font-size:13px;color:#374151;font-weight:600;margin-bottom:8px;">② 按保司简称</div>
                            <div style="display:flex;gap:8px;margin-bottom:8px;">
                                <input v-model="scopeCompanyInput" @keyup.enter="addScopeCompany" class="form-input" style="flex:1;" placeholder="输入保司简称，回车添加（可逗号分隔）">
                                <button type="button" @click="addScopeCompany" class="btn btn-outline" style="white-space:nowrap;">添加</button>
                            </div>
                            <div v-if="scopeForm.companies.length" style="display:flex;flex-wrap:wrap;gap:7px;">
                                <span v-for="c in scopeForm.companies" :key="c" class="scope-company-tag">
                                    {{ c }}<button type="button" @click="removeScopeCompany(c)">✕</button>
                                </span>
                            </div>
                            <div v-else style="font-size:12px;color:#c8c2bb;">未添加保司，此条件不生效</div>
                        </div>

                        <!-- ③ 按保司成熟度 -->
                        <div style="margin-bottom:8px;">
                            <div style="font-size:13px;color:#374151;font-weight:600;margin-bottom:8px;">③ 按保司成熟度</div>
                            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#374151;flex-wrap:wrap;">
                                <input type="checkbox" v-model="scopeHistoryEnabled" style="accent-color:#c2410c;">
                                保司历史总识别数少于
                                <input type="number" v-model.number="scopeHistoryValue" min="1" :disabled="!scopeHistoryEnabled" class="form-input" style="width:80px;height:34px;">
                                单的自动质检
                            </label>
                        </div>
                    </div>

                    <div class="flex justify-end gap-3 mt-6">
                        <button @click="showScopeModal=false" class="btn btn-outline">取消</button>
                        <button @click="saveScopeConfig" :disabled="scopeSaving" class="btn btn-primary">{{ scopeSaving ? '保存中…' : '保存' }}</button>
                    </div>
                </div>
            </div>
        </transition>

        <!-- 提示消息 -->
        <transition name="fade">
            <div v-if="toast" class="fixed top-4 right-4 z-50 bg-white shadow-lg rounded-lg px-5 py-3 text-sm flex items-center gap-2 border"
                :class="toast.type === 'success' ? 'border-green-200 text-green-700' : 'border-red-200 text-red-700'">
                <svg v-if="toast.type === 'success'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                <svg v-else class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                {{ toast.msg }}
            </div>
        </transition>

        <!-- 设置推荐人弹窗 -->
        <transition name="fade">
            <div v-if="showReferrerModal" class="modal-mask" @click.self="showReferrerModal=false">
                <div class="modal-content" style="width:min(380px, calc(100vw - 32px));">
                    <h3 class="text-lg font-semibold text-gray-800 mb-1">设置推荐人</h3>
                    <p style="font-size:13px;color:#9ca3af;margin-bottom:16px;">{{ referrerEnt ? referrerEnt.name : '' }}</p>
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">选择推荐人（输入姓名/手机号搜索）</label>
                        <input v-model="referrerSearch" @input="searchReferrerUsers" placeholder="输入姓名或手机号..."
                               class="form-input" style="width:100%;margin-bottom:8px;">
                        <div v-if="referrerUserList.length" style="border:1px solid #e7e0d8;border-radius:8px;max-height:180px;overflow-y:auto;">
                            <div v-for="u in referrerUserList" :key="u.id"
                                 @click="selectReferrer(u)"
                                 :style="{
                                   padding:'8px 12px', cursor:'pointer', fontSize:'13px',
                                   display:'flex', justifyContent:'space-between', alignItems:'center',
                                   background: referrerSelected && referrerSelected.id===u.id ? '#fff7ed' : ''
                                 }"
                                 @mouseenter="e => { if(!(referrerSelected && referrerSelected.id===u.id)) e.currentTarget.style.background='#fafafa' }"
                                 @mouseleave="e => { e.currentTarget.style.background = (referrerSelected && referrerSelected.id===u.id) ? '#fff7ed' : '' }">
                                <span>{{ u.name || u.phone }}</span>
                                <span style="font-size:11px;color:#9ca3af;">{{ u.phone }}</span>
                            </div>
                        </div>
                        <div v-if="referrerSelected" style="margin-top:8px;padding:8px 12px;background:#fff7ed;border-radius:8px;font-size:13px;color:#92400e;">
                            已选：{{ referrerSelected.name || referrerSelected.phone }}
                            <button @click="referrerSelected=null" style="margin-left:8px;color:#9ca3af;background:none;border:none;cursor:pointer;">✕ 清除</button>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-6">
                        <button @click="showReferrerModal=false" class="btn btn-outline">取消</button>
                        <button @click="saveReferrer" :disabled="referrerSaving" class="btn btn-primary">{{ referrerSaving ? '保存中…' : '确定' }}</button>
                    </div>
                </div>
            </div>
        </transition>
    </template>
</div>

<script>
const { createApp, ref, reactive, computed, watch, onMounted } = Vue;

function getToken() { return localStorage.getItem('token'); }
function getUser() { try { return JSON.parse(localStorage.getItem('user')); } catch { return null; } }
function doLogout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = '/login'; }
async function authFetch(url, options = {}) {
    const headers = { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json', ...(options.headers || {}) };
    const resp = await fetch(url, { ...options, headers });
    if (resp.status === 401) { doLogout(); throw new Error('未登录'); }
    return resp;
}

createApp({
    setup() {
        const ready = ref(false);
        const noPermission = ref(false);
        const currentUser = ref({});
        const loading = ref(false);
        const enterprises = ref([]);
        const entSearch = ref('');
        const mobileMenuOpen = ref(false);
        const filteredEnterprises = Vue.computed(() => {
            const q = entSearch.value.trim().toLowerCase();
            if (!q) return enterprises.value;
            return enterprises.value.filter(e =>
                (e.name || '').toLowerCase().includes(q) ||
                (e.contact_person || '').toLowerCase().includes(q) ||
                (e.contact_phone || '').includes(q)
            );
        });

        const showModal = ref(false);
        const isEdit = ref(false);
        const editId = ref(null);
        const form = reactive({ name: '', enterprise_no: '', contact_person: '', contact_phone: '' });
        const formError = ref('');
        const submitting = ref(false);

        // 开通套餐弹窗
        const showPlanModal = ref(false);
        const planEditEnt = ref(null);
        const planForm = reactive({ plan_type: 'standard', plan_months: 1, stack_plan: false });
        const planFormError = ref('');
        const planSubmitting = ref(false);
        const planCurrentExpiry = ref('');
        const editCurrentExpiry = ref(''); // 保留兼容


        // 套餐到期相关计算
        function planExpiry(ent) {
            if (!ent.plan_start_at) return null;
            const start = new Date(String(ent.plan_start_at).replace(' ', 'T'));
            if (isNaN(start.getTime())) return null;
            const months = ent.plan_months || (ent.plan_type === 'trial' ? 2 : 1);
            const d = new Date(start);
            d.setMonth(d.getMonth() + months);
            return d;
        }
        function planDaysLeft(ent) {
            const exp = planExpiry(ent);
            if (!exp) return null;
            return Math.ceil((exp - Date.now()) / 86400000);
        }
        function planExpiryStr(ent) {
            const exp = planExpiry(ent);
            if (!exp || isNaN(exp.getTime())) return '';
            return exp.toISOString().slice(0, 10);
        }
        function nextPlanExpiryStr(ent) {
            if (!ent.next_plan_start_at) return '';
            return String(ent.next_plan_start_at).slice(0, 10);
        }


        // 导出企业报告
        const showReportModal = ref(false);
        const reportTarget = ref(null);
        const reportRange = ref('7');
        const reportStart = ref('');
        const reportEnd = ref('');
        const reportSubmitting = ref(false);
        const reportLink = ref('');
        const reportCopied = ref(false);
        function openReportModal(ent) {
            reportTarget.value = ent;
            reportRange.value = '7';
            reportStart.value = '';
            reportEnd.value = '';
            reportLink.value = '';
            showReportModal.value = true;
        }
        function _fmtDate(d) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
        async function doExportReport() {
            const ent = reportTarget.value;
            if (!ent) return;
            let start, end;
            const today = new Date();
            if (reportRange.value === '7') {
                const s = new Date(today); s.setDate(s.getDate() - 6);
                start = _fmtDate(s); end = _fmtDate(today);
            } else if (reportRange.value === 'lastmonth') {
                // 上月：上一个自然月 1 号到最后一天
                const pad = n => String(n).padStart(2, '0');
                const m = today.getMonth();               // 0-11，当前月
                const lm = m === 0 ? 12 : m;              // 上月(1-12)
                const ly = m === 0 ? today.getFullYear() - 1 : today.getFullYear();
                const lastDay = new Date(ly, lm, 0).getDate();
                start = ly + '-' + pad(lm) + '-01';
                end = ly + '-' + pad(lm) + '-' + pad(lastDay);
            } else {
                start = reportStart.value; end = reportEnd.value;
                if (!start || !end) { showToast('请选择起止日期', 'error'); return; }
                if (start > end) { showToast('起始日期不能晚于结束日期', 'error'); return; }
            }
            // 生成带签名的网页报告链接（客户凭链接免登录查看，签名防止改企业ID看别家数据）
            try {
                const _r = await authFetch(`/api/insurance/enterprise-report?format=link&enterprise_id=${ent.id}&date_start=${start}&date_end=${end}`);
                const _j = await _r.json();
                if (_j.code !== 0) { showToast(_j.msg || '生成失败', 'error'); return; }
                reportLink.value = `${window.location.origin}/enterprise-report-view?enterprise_id=${ent.id}&date_start=${start}&date_end=${end}&sign=${_j.data.sign}&enterprise_name=${encodeURIComponent(ent.name || '')}`;
            } catch (e) { showToast('生成失败', 'error'); return; }
            reportCopied.value = false;
        }
        function copyReportLink() {
            const ok = () => { reportCopied.value = true; setTimeout(()=>reportCopied.value=false, 2000); };
            if (navigator.clipboard) navigator.clipboard.writeText(reportLink.value).then(ok).catch(ok);
            else ok();
        }

        // 设置推荐人
        const showReferrerModal = ref(false);
        const referrerEnt = ref(null);
        const referrerSearch = ref('');
        const referrerUserList = ref([]);
        const referrerSelected = ref(null);
        const referrerSaving = ref(false);
        let referrerSearchTimer = null;

        function openSetReferrer(ent) {
            referrerEnt.value = ent;
            referrerSearch.value = '';
            referrerUserList.value = [];
            referrerSelected.value = ent.referrer_id ? { id: ent.referrer_id, name: ent.referrer_name, phone: '' } : null;
            showReferrerModal.value = true;
        }

        function searchReferrerUsers() {
            clearTimeout(referrerSearchTimer);
            const q = referrerSearch.value.trim();
            if (!q) { referrerUserList.value = []; return; }
            referrerSearchTimer = setTimeout(async () => {
                try {
                    const res = await authFetch(`/api/auth/users?q=${encodeURIComponent(q)}&limit=10`);
                    const json = await res.json();
                    if (json.code === 0) referrerUserList.value = json.data || [];
                } catch(e) {}
            }, 300);
        }

        function selectReferrer(u) { referrerSelected.value = u; }

        async function saveReferrer() {
            referrerSaving.value = true;
            try {
                const res = await authFetch(`/api/auth/enterprises/${referrerEnt.value.id}/referrer`, {
                    method: 'PUT',
                    body: JSON.stringify({ referrer_id: referrerSelected.value ? referrerSelected.value.id : null })
                });
                const json = await res.json();
                if (json.code === 0) {
                    showToast('推荐人已设置');
                    showReferrerModal.value = false;
                    fetchEnterprises();
                } else { showToast(json.msg || '设置失败', 'error'); }
            } catch(e) { showToast('网络错误', 'error'); }
            finally { referrerSaving.value = false; }
        }

        // ===== AI质检（仅超管） =====
        // 附加数据：按 enterprise_id 存 {today_checked, config}，与企业列表分开加载后合并显示
        const aiCheckMap = ref({});
        const STATUS_OPTIONS = ['非保单', '需人工补充', '识别异常', '识别失败', '正常完成'];

        function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

        // 归一化配置，保证 scope 结构完整（后端字段缺失时兜底）
        function normalizeAiConfig(cfg) {
            cfg = cfg || {};
            const s = cfg.scope || {};
            return {
                enabled: !!cfg.enabled,
                auto_fix: !!cfg.auto_fix,
                scope: {
                    mode: s.mode || 'all',
                    statuses: Array.isArray(s.statuses) ? s.statuses : [],
                    companies: Array.isArray(s.companies) ? s.companies : [],
                    company_history_lt: Number(s.company_history_lt || 0),
                },
                compare_fields: Array.isArray(cfg.compare_fields) ? cfg.compare_fields : [],
            };
        }
        // 未配置企业的默认展示项（只读，不直接改动）
        const DEFAULT_AI_ENTRY = { today_checked: 0, config: normalizeAiConfig(null) };
        function aiOf(ent) { return aiCheckMap.value[ent.id] || DEFAULT_AI_ENTRY; }
        function aiConfigOf(ent) {
            const e = aiCheckMap.value[ent.id];
            return e && e.config ? e.config : normalizeAiConfig(null);
        }
        // 徽标显示的自定义条件条数
        function scopeCondCount(scope) {
            if (!scope) return 0;
            let n = 0;
            n += (scope.statuses && scope.statuses.length) || 0;
            n += (scope.companies && scope.companies.length) || 0;
            n += Number(scope.company_history_lt) > 0 ? 1 : 0;
            return n;
        }

        async function loadAiCheck() {
            // AI配置加载失败不影响页面原有功能
            try {
                const resp = await authFetch('/api/insurance/ai-check/enterprises');
                const data = await resp.json();
                if (data.code === 0 && data.data && Array.isArray(data.data.list)) {
                    const map = {};
                    data.data.list.forEach(item => {
                        map[item.enterprise_id] = {
                            today_checked: item.today_checked || 0,
                            config: normalizeAiConfig(item.config),
                        };
                    });
                    aiCheckMap.value = map;
                }
            } catch (e) { /* 静默：不阻断企业列表 */ }
        }

        // 保存单个企业的完整 config，成功后回写本地 map
        async function saveAiConfig(ent, config) {
            const resp = await authFetch('/api/insurance/ai-check/enterprises', {
                method: 'PUT',
                body: JSON.stringify({ enterprise_id: ent.id, config }),
            });
            const data = await resp.json();
            if (data.code !== 0) throw new Error(data.msg || '保存失败');
            const prev = aiCheckMap.value[ent.id] || { today_checked: 0 };
            aiCheckMap.value = { ...aiCheckMap.value, [ent.id]: { ...prev, config } };
        }

        async function toggleAiEnabled(ent) {
            const cfg = deepClone(aiConfigOf(ent));
            cfg.enabled = !cfg.enabled;
            try {
                await saveAiConfig(ent, cfg);
                showToast('AI质检已' + (cfg.enabled ? '开启' : '关闭'));
            } catch (e) { showToast(e.message || '操作失败', 'error'); }
        }

        async function toggleAiAutoFix(ent) {
            const cur = aiConfigOf(ent);
            const turningOn = !cur.auto_fix;
            if (turningOn && !confirm('开启后AI发现差异将直接覆盖系统数据（可还原），确定？')) return;
            const cfg = deepClone(cur);
            cfg.auto_fix = turningOn;
            try {
                await saveAiConfig(ent, cfg);
                showToast('AI直接覆盖已' + (turningOn ? '开启' : '关闭'));
            } catch (e) { showToast(e.message || '操作失败', 'error'); }
        }

        // 质检范围配置弹窗
        const showScopeModal = ref(false);
        const scopeEnt = ref(null);
        const scopeForm = reactive({ mode: 'all', statuses: [], companies: [], company_history_lt: 0 });
        const scopeHistoryEnabled = ref(false);
        const scopeHistoryValue = ref(50);
        const scopeCompanyInput = ref('');
        const scopeSaving = ref(false);

        function openScopeModal(ent) {
            scopeEnt.value = ent;
            const s = aiConfigOf(ent).scope || {};
            scopeForm.mode = s.mode || 'all';
            scopeForm.statuses = Array.isArray(s.statuses) ? [...s.statuses] : [];
            scopeForm.companies = Array.isArray(s.companies) ? [...s.companies] : [];
            const hl = Number(s.company_history_lt || 0);
            scopeHistoryEnabled.value = hl > 0;
            scopeHistoryValue.value = hl > 0 ? hl : 50;
            scopeCompanyInput.value = '';
            showScopeModal.value = true;
        }
        function toggleScopeStatus(st) {
            const i = scopeForm.statuses.indexOf(st);
            if (i >= 0) scopeForm.statuses.splice(i, 1); else scopeForm.statuses.push(st);
        }
        function addScopeCompany() {
            const raw = scopeCompanyInput.value.trim();
            if (!raw) return;
            // 支持一次输入多个（逗号/空格分隔）
            raw.split(/[，,\s]+/).forEach(name => {
                const n = name.trim();
                if (n && !scopeForm.companies.includes(n)) scopeForm.companies.push(n);
            });
            scopeCompanyInput.value = '';
        }
        function removeScopeCompany(name) {
            const i = scopeForm.companies.indexOf(name);
            if (i >= 0) scopeForm.companies.splice(i, 1);
        }
        async function saveScopeConfig() {
            const ent = scopeEnt.value;
            if (!ent) return;
            scopeSaving.value = true;
            try {
                const cfg = deepClone(aiConfigOf(ent));
                cfg.scope = {
                    mode: scopeForm.mode,
                    statuses: scopeForm.mode === 'custom' ? [...scopeForm.statuses] : [],
                    companies: scopeForm.mode === 'custom' ? [...scopeForm.companies] : [],
                    company_history_lt: (scopeForm.mode === 'custom' && scopeHistoryEnabled.value) ? (Number(scopeHistoryValue.value) || 0) : 0,
                };
                await saveAiConfig(ent, cfg);
                showToast('质检范围已保存');
                showScopeModal.value = false;
            } catch (e) { showToast(e.message || '保存失败', 'error'); }
            finally { scopeSaving.value = false; }
        }

        const toast = ref(null);
        let toastTimer = null;
        function showToast(msg, type = 'success') {
            toast.value = { msg, type };
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.value = null; }, 3000);
        }

        function checkAuth() {
            const token = getToken();
            if (!token) { doLogout(); return false; }
            const user = getUser();
            if (!user) { doLogout(); return false; }
            if (user.role !== 'super_admin') {
                noPermission.value = true;
                return false;
            }
            currentUser.value = user;
            return true;
        }

        function formatTime(t) {
            if (!t) return '-';
            return t.replace('T', ' ').substring(0, 19);
        }

        async function fetchEnterprises() {
            loading.value = true;
            try {
                const resp = await authFetch('/api/auth/enterprises');
                const data = await resp.json();
                if (data.code === 0) {
                    enterprises.value = data.data || [];
                } else {
                    showToast(data.msg || '获取企业列表失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            } finally {
                loading.value = false;
            }
        }

        function openCreateModal() {
            isEdit.value = false;
            editId.value = null;
            form.name = '';
            form.enterprise_no = '';
            form.contact_person = '';
            form.contact_phone = '';
            formError.value = '';
            referrerSearch.value = '';
            referrerUserList.value = [];
            referrerSelected.value = null;
            showModal.value = true;
        }

        function openEditModal(ent) {
            isEdit.value = true;
            editId.value = ent.id;
            form.name = ent.name || '';
            form.enterprise_no = ent.enterprise_no || '';
            form.contact_person = ent.contact_person || '';
            form.contact_phone = ent.contact_phone || '';
            formError.value = '';
            showModal.value = true;
        }

        function closeModal() {
            showModal.value = false;
        }

        // ===== 识别加油包管理 =====
        const showBoostModal = ref(false);
        const boostEnt = ref(null);
        const boostPacks = ref([]);
        const boostBalance = ref(null);
        const boostSubmitting = ref(false);
        async function loadBoostPacks() {
            if (!boostEnt.value) return;
            try {
                const res = await authFetch(`/api/auth/enterprises/${boostEnt.value.id}/boost-packs`);
                const data = await res.json();
                if (data.code === 0) { boostPacks.value = data.data.packs || []; boostBalance.value = data.data.balance || null; }
            } catch (e) {}
        }
        function openBoostModal(ent) {
            boostEnt.value = ent; boostPacks.value = []; boostBalance.value = null;
            showBoostModal.value = true;
            loadBoostPacks();
        }
        async function addBoostPack() {
            if (!boostEnt.value) return;
            if (!confirm(`确定为「${boostEnt.value.name}」开通一个加油包？\n¥99 / 1,200次 / 自今日起3个月有效`)) return;
            boostSubmitting.value = true;
            try {
                const res = await authFetch(`/api/auth/enterprises/${boostEnt.value.id}/boost-packs`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
                const data = await res.json();
                if (data.code === 0) { showToast('加油包已开通'); await loadBoostPacks(); }
                else showToast(data.msg || '开通失败', 'error');
            } catch (e) { showToast('开通失败', 'error'); }
            finally { boostSubmitting.value = false; }
        }
        async function removeBoostPack(p) {
            if (!confirm(`确定删除这个加油包？（已用 ${p.used_count}/${p.total_count}）删除后余量立即失效`)) return;
            try {
                const res = await authFetch(`/api/auth/boost-packs/${p.id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.code === 0) { showToast('已删除'); await loadBoostPacks(); }
                else showToast(data.msg || '删除失败', 'error');
            } catch (e) { showToast('删除失败', 'error'); }
        }

        function openPlanModal(ent) {
            planEditEnt.value = ent;
            planForm.plan_type = ent.plan_type || 'standard';
            planForm.plan_months = ent.plan_months || 1;
            const expStr = planExpiryStr(ent);
            const daysLeft = planDaysLeft(ent);
            if (expStr && daysLeft !== null && daysLeft > 0) {
                planCurrentExpiry.value = expStr;
                planForm.stack_plan = true;
            } else {
                planCurrentExpiry.value = '';
                planForm.stack_plan = false;
            }
            planFormError.value = '';
            showPlanModal.value = true;
        }

        function closePlanModal() {
            showPlanModal.value = false;
        }

        async function submitPlanForm() {
            planFormError.value = '';
            planSubmitting.value = true;
            try {
                const body = {
                    plan_type: planForm.plan_type,
                    plan_months: Number(planForm.plan_months),
                    stack_plan: !!planForm.stack_plan,
                };
                const resp = await authFetch('/api/auth/enterprises/' + planEditEnt.value.id, {
                    method: 'PUT',
                    body: JSON.stringify(body),
                });
                const data = await resp.json();
                if (data.code === 0) {
                    showToast('套餐已更新');
                    closePlanModal();
                    fetchEnterprises();
                } else {
                    planFormError.value = data.msg || '操作失败';
                }
            } catch (e) {
                planFormError.value = '网络错误';
            } finally {
                planSubmitting.value = false;
            }
        }

        // ===== 企业信息收集表 =====
        const showSurveyModal = ref(false);
        const surveyEnt = ref({});
        const surveyUrl = ref('');
        const surveySubmitted = ref(false);
        const surveyRows = ref([]);
        const copied = ref(false);
        const SURVEY_LABELS = [
            ['company_full_name','企业全称'],['contact_name','联系人'],['contact_phone','手机号'],
            ['monthly_policies','每月保单量'],['main_insurers','主要保司'],['staff_list','人员名单'],
            ['excel_template','台账模板'],['company_abbr','保司简称'],['policy_abbr','险种简称'],
            ['commission','佣金计算'],['date_format','日期格式'],
        ];
        async function openSurveyModal(ent) {
            surveyEnt.value = ent; copied.value = false; surveySubmitted.value = false; surveyRows.value = [];
            try {
                const resp = await authFetch('/api/auth/enterprises/' + ent.id + '/survey-link', { method: 'POST' });
                const j = await resp.json();
                if (j.code === 0) {
                    surveyUrl.value = window.location.origin + j.data.path;
                    if (ent.survey_data) {
                        try {
                            const d = JSON.parse(ent.survey_data);
                            surveySubmitted.value = true;
                            surveyRows.value = SURVEY_LABELS.map(([k,label]) => ({label, value: d[k]}));
                        } catch(e){}
                    }
                    showSurveyModal.value = true;
                } else { toast(j.msg || '生成链接失败'); }
            } catch(e) { toast('网络错误'); }
        }
        function copySurveyLink() {
            const ok = () => { copied.value = true; setTimeout(()=>copied.value=false, 2000); };
            if (navigator.clipboard) navigator.clipboard.writeText(surveyUrl.value).then(ok).catch(ok);
            else ok();
        }

        async function submitForm() {
            formError.value = '';
            if (!form.name.trim()) { formError.value = '请输入企业名称'; return; }
            if (!form.enterprise_no.trim()) { formError.value = '请输入企业编号'; return; }
            submitting.value = true;
            try {
                const body = {
                    name: form.name.trim(),
                    enterprise_no: form.enterprise_no.trim(),
                    contact_person: form.contact_person.trim(),
                    contact_phone: form.contact_phone.trim(),
                };
                if (!isEdit.value) {
                    body.referrer_id = referrerSelected.value ? referrerSelected.value.id : null;
                }
                const url = isEdit.value ? '/api/auth/enterprises/' + editId.value : '/api/auth/enterprises';
                const method = isEdit.value ? 'PUT' : 'POST';
                const resp = await authFetch(url, { method, body: JSON.stringify(body) });
                const data = await resp.json();
                if (data.code === 0) {
                    showToast(isEdit.value ? '企业已更新' : '企业已添加');
                    closeModal();
                    fetchEnterprises();
                } else {
                    formError.value = data.msg || '操作失败';
                }
            } catch (e) {
                formError.value = '网络错误';
            } finally {
                submitting.value = false;
            }
        }

        // 切换到企业试用时，月数超过2则自动重置为1
        watch(() => planForm.plan_type, (val) => {
            if (val === 'enterprise_trial' && planForm.plan_months > 2) {
                planForm.plan_months = 1;
            }
        });

        async function toggleEnabled(ent) {
            const newEnabled = !ent.enabled;
            const action = newEnabled ? '启用' : '禁用';
            try {
                const resp = await authFetch('/api/auth/enterprises/' + ent.id, {
                    method: 'PUT',
                    body: JSON.stringify({ enabled: newEnabled }),
                });
                const data = await resp.json();
                if (data.code === 0) {
                    showToast('已' + action + '企业「' + ent.name + '」');
                    fetchEnterprises();
                } else {
                    showToast(data.msg || action + '失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        async function toggleSeal(ent) {
            const nv = ent.seal_tracking_enabled ? 0 : 1;
            try {
                const resp = await authFetch('/api/auth/enterprises/' + ent.id, {
                    method: 'PUT',
                    body: JSON.stringify({ seal_tracking_enabled: nv }),
                });
                const data = await resp.json();
                if (data.code === 0) {
                    ent.seal_tracking_enabled = nv;
                    showToast((nv ? '已开启' : '已关闭') + '「' + ent.name + '」公户车盖章跟进');
                } else {
                    showToast(data.msg || '操作失败', 'error');
                }
            } catch (e) { showToast('操作失败', 'error'); }
        }

        async function toggleMerge(ent) {
            const nv = ent.merge_by_plate ? 0 : 1;
            try {
                const resp = await authFetch('/api/auth/enterprises/' + ent.id, {
                    method: 'PUT',
                    body: JSON.stringify({ merge_by_plate: nv }),
                });
                const data = await resp.json();
                if (data.code === 0) {
                    ent.merge_by_plate = nv;
                    showToast((nv ? '已开启' : '已关闭') + '「' + ent.name + '」按车牌合并显示');
                } else {
                    showToast(data.msg || '操作失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        function logout() { doLogout(); }

        // 进入某企业的人员/监控（三级目录：服务企业管理 > 企业 > 人员/监控）
        function gotoMembers(ent) {
            window.location.href = `/admin/users?enterprise_id=${ent.id}&enterprise_name=${encodeURIComponent(ent.name || '')}`;
        }
        function gotoMonitor(ent) {
            window.location.href = `/monitor-config?enterprise_id=${ent.id}&enterprise_name=${encodeURIComponent(ent.name || '')}`;
        }

        // ===== 续保推送群绑定 =====
        const showPushModal = ref(false);
        const pushEnt = ref(null);
        const pushRoomOptions = ref([]);
        const pushSelectedIds = ref([]);
        const pushRoomSearch = ref('');
        const pushSaving = ref(false);
        const filteredPushRooms = computed(() => {
            const kw = pushRoomSearch.value.trim();
            return kw ? pushRoomOptions.value.filter(r => (r.name || '').includes(kw)) : pushRoomOptions.value;
        });
        async function openPushModal(ent) {
            pushEnt.value = ent;
            pushSelectedIds.value = [];
            pushRoomSearch.value = '';
            pushRoomOptions.value = [];
            showPushModal.value = true;
            // 可选群 = 该企业监控绑定的群（按企业过滤，每次打开都按当前企业加载）
            try {
                const res = await authFetch(`/api/renewal/push-room-options?enterprise_id=${ent.id}`);
                const data = await res.json();
                const rooms = (data.data && data.data.rooms) || [];
                pushRoomOptions.value = rooms.map(x => ({ id: x.id || x.roomid, name: x.name || x.roomid }));
            } catch (e) {}
            try {
                const res = await authFetch(`/api/renewal/push-rooms?enterprise_id=${ent.id}`);
                const data = await res.json();
                pushSelectedIds.value = ((data.data && data.data.rooms) || []).map(x => x.roomid);
            } catch (e) {}
        }
        async function savePushRooms() {
            if (!pushEnt.value) return;
            pushSaving.value = true;
            const rooms = pushSelectedIds.value.map(id => {
                const opt = pushRoomOptions.value.find(o => o.id === id);
                return { roomid: id, room_name: opt ? opt.name : '' };
            });
            try {
                const res = await authFetch('/api/renewal/push-rooms', {
                    method: 'POST', body: JSON.stringify({ enterprise_id: pushEnt.value.id, rooms })
                });
                const data = await res.json();
                if (data.code === 0) { showToast('已保存'); showPushModal.value = false; fetchEnterprises(); }
                else showToast(data.msg || '保存失败', 'error');
            } catch (e) { showToast('保存失败', 'error'); }
            finally { pushSaving.value = false; }
        }

        onMounted(() => {
            if (checkAuth()) {
                ready.value = true;
                const _params = new URLSearchParams(window.location.search);
                const _presetSearch = _params.get('search');
                if (_presetSearch) entSearch.value = _presetSearch;
                if (_params.get('create') === '1') openCreateModal();
                fetchEnterprises();
                loadAiCheck();
            }
        });

        return {
            ready, noPermission, currentUser, loading, enterprises, entSearch, filteredEnterprises,
            showModal, isEdit, form, formError, submitting,
            openCreateModal, openEditModal, closeModal, submitForm,
            showPlanModal, planEditEnt, planForm, planFormError, planSubmitting, planCurrentExpiry,
            openPlanModal, closePlanModal, submitPlanForm,
            showBoostModal, boostEnt, boostPacks, boostBalance, boostSubmitting, openBoostModal, addBoostPack, removeBoostPack,
            toggleEnabled, toggleMerge, toggleSeal, logout, toast, formatTime, gotoMembers, gotoMonitor,
            showPushModal, pushEnt, pushRoomOptions, pushSelectedIds, pushRoomSearch, pushSaving, filteredPushRooms, openPushModal, savePushRooms,
            showReportModal, reportTarget, reportRange, reportStart, reportEnd, reportSubmitting,
            reportLink, reportCopied, copyReportLink,
            openReportModal, doExportReport,
            planDaysLeft, planExpiryStr, nextPlanExpiryStr,
            showReferrerModal, referrerEnt, referrerSearch, referrerUserList, referrerSelected, referrerSaving,
            openSetReferrer, searchReferrerUsers, selectReferrer, saveReferrer,
            mobileMenuOpen,
            showSurveyModal, surveyEnt, surveyUrl, surveySubmitted, surveyRows, copied, openSurveyModal, copySurveyLink,
            // AI质检
            aiOf, scopeCondCount, toggleAiEnabled, toggleAiAutoFix,
            showScopeModal, scopeEnt, scopeForm, scopeHistoryEnabled, scopeHistoryValue, scopeCompanyInput, scopeSaving,
            STATUS_OPTIONS, openScopeModal, toggleScopeStatus, addScopeCompany, removeScopeCompany, saveScopeConfig,
        };
    }
}).mount('#app');
</script>
</body>
</html>{% endraw %}
