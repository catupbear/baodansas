{% raw %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号管理 - 午虎AI保单台账</title>
    <script src="/static/vue.global.prod.js"></script>
    <link href="/static/tailwind.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #c2410c;
            --primary-light: #ea580c;
            --primary-bg: #fff7ed;
            --surface: #ffffff;
            --surface-secondary: #fffbf7;
            --border: #e7e0d8;
            --border-light: #f5f0eb;
            --text-primary: #1c1410;
            --text-secondary: #57534e;
            --text-muted: #a8a29e;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
        }
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #faf5f0; }
        [v-cloak] { display: none; }

        /* 过渡动画 */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.2s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }

        /* 弹窗遮罩 */
        .modal-mask {
            position: fixed; inset: 0;
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 50;
        }
        .modal-content {
            background: white; border-radius: 12px;
            padding: 24px; width: 420px;
            max-height: 80vh; overflow-y: auto;
        }

        /* 数据表格 */
        .data-table { font-size: 13px; border-collapse: collapse; width: 100%; table-layout: fixed; }
        .data-table th {
            background: #faf8f5; color: #57534e; font-weight: 500;
            text-align: left; padding: 10px 12px;
            border-bottom: 1px solid #e7e0d8;
            white-space: nowrap;
        }
        .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #f5f0eb;
            overflow: hidden; text-overflow: ellipsis;
        }
        .data-table tr:hover { background: #fffbf7; }

        /* 按钮 */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 8px;
            font-size: 14px; font-weight: 500;
            transition: all 0.2s ease; cursor: pointer;
            border: none; outline: none;
        }
        .btn:focus-visible { box-shadow: 0 0 0 3px rgba(234,88,12,0.3); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: #9a3412; }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
        .btn { white-space: nowrap; }
        .btn-outline {
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-outline:hover { background: var(--surface-secondary); border-color: #cbd5e1; }

        /* 徽标 */
        .badge {
            display: inline-flex; align-items: center;
            padding: 2px 8px; border-radius: 6px;
            font-size: 12px; font-weight: 500;
            white-space: nowrap;
        }
        .badge-red { background: #fef2f2; color: #dc2626; }
        .badge-blue { background: #eff6ff; color: #2563eb; }
        .badge-green { background: #ecfdf5; color: #059669; }
        .badge-gray { background: #f3f4f6; color: #6b7280; }

        /* 表单输入 */
        .form-input {
            width: 100%; height: 40px; padding: 0 12px;
            border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: var(--primary-light); }
        .form-input:disabled { background: #f9fafb; color: #9ca3af; cursor: not-allowed; }
        .form-select {
            width: 100%; height: 40px; padding: 0 12px;
            border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; outline: none; background: white;
            transition: border-color 0.2s;
        }
        .form-select:focus { border-color: var(--primary-light); }

        /* 移动端适配 */
        @media (max-width: 640px) {
            .mobile-bar { flex-wrap: wrap !important; gap: 8px !important; }
            .mobile-bar > * { flex-shrink: 0; }
            .mobile-search { width: 100% !important; }
            .mobile-search input { width: 100% !important; }
            .modal-mask { align-items: flex-start; padding-top: 20px; }
            .modal-content { width: min(420px, calc(100vw - 32px)) !important; }
            /* 账号管理：左右布局在手机上改为「顶部横向分组条 + 下方列表」 */
            .ug-layout { flex-direction: column !important; min-height: 0 !important; }
            .ug-sidebar { width: 100% !important; max-height: none !important; border-right: none !important; border-bottom: 1px solid #f0f0f0; display: flex !important; overflow-x: auto; overflow-y: hidden; }
            .ug-sidebar > div { flex-shrink: 0; border-left: none !important; white-space: nowrap; }
            .ug-main { max-height: none !important; }
        }
    </style>
</head>
<body class="min-h-screen">
<div id="app" v-cloak>
    <!-- 无权限提示 -->
    <div v-if="noPermission" class="min-h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="text-6xl mb-4">&#128274;</div>
            <h2 class="text-xl font-semibold text-gray-800 mb-2">无访问权限</h2>
            <p class="text-gray-500 mb-6">仅超级管理员可访问此页面</p>
            <a href="/insurance" class="btn btn-primary">返回首页</a>
        </div>
    </div>

    <!-- 主内容 -->
    <template v-if="!noPermission && ready">
        <!-- 顶部导航栏 -->
        <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <span class="font-semibold text-gray-800">午虎AI保单台账</span>
                <!-- 内部管理界面醒目标识（仅内部超级管理员可见；白色导航栏用红底白字变体） -->
                <span v-if="currentUser && currentUser.role === 'super_admin'" style="display:inline-flex;align-items:center;gap:4px;background:#dc2626;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(220,38,38,0.35);letter-spacing:0.5px;">
                    <svg style="width:15px;height:15px;flex-shrink:0;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                    内部管理界面
                </span>
                <a href="/insurance" class="hidden sm:inline text-sm text-gray-500 hover:text-orange-600">保单台账</a>
                <a href="/admin/enterprises" class="hidden sm:inline text-sm text-gray-500 hover:text-orange-600">服务企业管理</a>
            </div>
            <div class="flex items-center space-x-4">
                <div class="hidden sm:flex items-center space-x-4">
                    <span class="text-sm text-gray-500">{{ currentUser.name || currentUser.phone }}</span>
                    <button @click="logout" class="text-sm text-gray-400 hover:text-red-500">退出</button>
                </div>
                <!-- 汉堡菜单按钮（仅移动端） -->
                <button @click="mobileMenuOpen = !mobileMenuOpen" class="sm:hidden p-2 rounded-lg text-gray-500 hover:bg-gray-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path v-if="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        <path v-else stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </nav>
        <!-- 移动端菜单面板 -->
        <div v-if="mobileMenuOpen" class="sm:hidden bg-white border-b border-gray-200 px-4 py-3 space-y-2">
            <a href="/insurance" class="block text-sm text-gray-600 py-2">保单台账</a>
            <a href="/admin/enterprises" class="block text-sm text-gray-600 py-2">服务企业管理</a>
            <hr class="border-gray-100">
            <div class="flex items-center justify-between py-2">
                <span class="text-sm text-gray-500">{{ currentUser.name || currentUser.phone }}</span>
                <button @click="logout" class="text-sm text-red-500">退出</button>
            </div>
        </div>

        <!-- 页面内容 -->
        <div class="max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-6">
            <!-- 面包屑 -->
            <div class="mb-3" style="font-size:13px;color:#9ca3af;">
                <a href="/admin/enterprises" style="color:#ea580c;text-decoration:none;">服务企业管理</a>
                <span v-if="isInternalView"> / 内部账号</span>
                <template v-else>
                    <span v-if="urlEnterpriseName"> / {{ urlEnterpriseName }}</span>
                    <span> / 人员管理</span>
                </template>
            </div>
            <!-- 操作栏 -->
            <div class="mobile-bar flex items-center justify-between mb-5">
                <div class="flex items-center gap-3" style="flex-wrap:wrap;">
                    <h1 class="text-lg font-semibold text-gray-800">{{ isInternalView ? '内部账号' : '账号管理' }}</h1>
                    <select v-if="!isInternalView" v-model="filterRole" @change="fetchUsers" class="form-select" style="width:130px;height:34px;font-size:13px;">
                        <option value="">全部角色</option>
                        <option value="enterprise">企业账号</option>
                        <option value="employee">员工账号</option>
                        <!-- <option value="agent_sales">代理销售</option> 暂时隐藏 -->
                    </select>
                    <div class="mobile-search" style="position:relative;">
                        <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:#9ca3af;pointer-events:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/>
                        </svg>
                        <input v-model="searchKeyword" type="text" placeholder="搜索姓名/手机号…"
                            style="height:34px;padding:0 10px 0 32px;border:1px solid #e7e0d8;border-radius:8px;font-size:13px;outline:none;width:190px;transition:border-color 0.2s;"
                            @focus="$event.target.style.borderColor='#ea580c'" @blur="$event.target.style.borderColor='#e7e0d8'">
                    </div>
                </div>
                <button @click="openCreateModal" class="btn btn-primary">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    创建用户
                </button>
            </div>

            <!-- 用户列表（左侧企业分组 + 右侧用户） -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <div v-if="loading" class="py-16 text-center text-gray-400 text-sm">加载中...</div>
                <div v-else-if="groupedUsers.length === 0" class="py-16 text-center text-gray-400 text-sm">{{ searchKeyword ? '无匹配结果' : '暂无用户数据' }}</div>
                <div v-else class="ug-layout" style="display:flex;align-items:stretch;min-height:420px;">
                    <!-- 左侧企业分组导航（从企业管理进入的单企业视图下隐藏） -->
                    <div v-if="!singleEnterprise" class="ug-sidebar" style="width:200px;flex-shrink:0;border-right:1px solid #f0f0f0;background:#fafafa;overflow-y:auto;max-height:72vh;">
                        <div v-for="group in groupedUsers" :key="group.key" @click="activeGroup = group.key"
                             :style="{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 14px',cursor:'pointer',fontSize:'14px',userSelect:'none',borderLeft:(activeGroupData && activeGroupData.key===group.key)?'3px solid #ea580c':'3px solid transparent',background:(activeGroupData && activeGroupData.key===group.key)?'#fff':'transparent',fontWeight:(activeGroupData && activeGroupData.key===group.key)?'600':'400',color:(activeGroupData && activeGroupData.key===group.key)?'#ea580c':'#374151'}">
                            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ group.name }}</span>
                            <span style="font-size:11px;color:#9ca3af;flex-shrink:0;margin-left:6px;">{{ group.users.filter(u=>u.enabled).length }}/{{ group.users.length }}</span>
                        </div>
                    </div>
                    <!-- 右侧用户列表 -->
                    <div v-if="activeGroupData" class="ug-main" style="flex:1;min-width:0;overflow:auto;max-height:72vh;">
                        <div>
                            <!-- 桌面端表格 -->
                            <div class="hidden sm:block overflow-x-auto">
                                <table class="data-table">
                                    <colgroup>
                                        <col style="width:12%;">
                                        <col style="width:8%;">
                                        <col style="width:9%;">
                                        <col style="width:10%;">
                                        <col style="width:12%;">
                                        <col style="width:8%;">
                                        <col style="width:11%;">
                                        <col style="width:30%;">
                                    </colgroup>
                                    <thead>
                                        <tr>
                                            <th>手机号</th>
                                            <th>姓名</th>
                                            <th>密码</th>
                                            <th>角色</th>
                                            <th>绑定发送人</th>
                                            <th>状态</th>
                                            <th>创建时间</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="user in activeGroupData.users" :key="user.id">
                                            <td class="font-medium text-gray-800">{{ user.phone }}</td>
                                            <td>{{ user.name || '-' }}</td>
                                            <td>
                                                <span v-if="user.plain_password" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#1c1410;letter-spacing:0.5px;user-select:all;">{{ user.plain_password }}</span>
                                                <span v-else style="color:#d1d5db;" title="历史账号未存明文，重置密码后即可显示">—</span>
                                            </td>
                                            <td>
                                                <div style="display:flex;flex-direction:column;gap:2px;align-items:flex-start;">
                                                    <span class="badge" :class="roleBadgeClass(user.role)">{{ roleLabel(user.role) }}</span>
                                                    <span v-if="false" style="font-size:11px;color:#9ca3af;">▸ {{ salesTypeLabel(user.sales_type) }}</span>
                                                </div>
                                            </td>
                                            <td>
                                                <div style="display:flex;flex-wrap:wrap;gap:3px;">
                                                    <span v-for="s in (user.bound_senders || [])" :key="s.sender"
                                                        class="badge badge-blue" style="font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                                                        :title="(s.sender_name || '') + ' (' + s.sender + ')'">
                                                        {{ s.sender_name || s.sender }}
                                                    </span>
                                                    <span v-if="!user.bound_senders || user.bound_senders.length === 0" style="color:#9ca3af;">-</span>
                                                </div>
                                            </td>
                                            <td>
                                                <div style="display:flex;flex-direction:column;gap:3px;align-items:flex-start;">
                                                    <span class="badge" :class="user.enabled ? 'badge-green' : 'badge-gray'">
                                                        {{ user.enabled ? '启用' : '禁用' }}
                                                    </span>
                                                    <span v-if="user.role !== 'super_admin'" class="badge"
                                                          :class="Number(user.activated) === 1 ? 'badge-green' : 'badge-gray'"
                                                          :style="Number(user.activated) === 1 ? '' : 'color:#b45309;background:#fef3c7;'">
                                                        {{ Number(user.activated) === 1 ? '已激活' : '待激活' }}
                                                    </span>
                                                </div>
                                            </td>
                                            <td class="text-gray-500">{{ formatTime(user.created_at) }}</td>
                                            <td>
                                                <div class="flex items-center flex-wrap gap-1.5" style="row-gap:6px;">
                                                    <button v-if="user.role !== 'super_admin'" @click="toggleActivated(user)"
                                                        :style="Number(user.activated) === 1 ? 'color:#d97706;border-color:#fbbf24' : 'color:#fff;background:#ea580c;border-color:#ea580c;font-weight:600;'"
                                                        class="btn btn-sm btn-outline">
                                                        {{ Number(user.activated) === 1 ? '取消激活' : '激活' }}
                                                    </button>
                                                    <button @click="toggleSuperAdmin(user)"
                                                        style="color:#7c3aed;border-color:#c4b5fd;"
                                                        class="btn btn-sm btn-outline">
                                                        {{ user.role === 'super_admin' ? '取消超管' : '设为超管' }}
                                                    </button>
                                                    <button @click="openEditModal(user)" class="btn btn-sm btn-outline">编辑</button>
                                                    <button @click="openResetPwdModal(user)" class="btn btn-sm btn-outline">重置密码</button>
                                                    <button @click="toggleEnabled(user)"
                                                        :style="user.enabled ? 'color:#d97706;border-color:#fbbf24' : 'color:#059669;border-color:#6ee7b7'"
                                                        class="btn btn-sm btn-outline">
                                                        {{ user.enabled ? '禁用' : '启用' }}
                                                    </button>
                                                    <button @click="openDeleteModal(user)"
                                                        style="color:#dc2626;border-color:#fca5a5;"
                                                        class="btn btn-sm btn-outline">删除</button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <!-- 移动端卡片 -->
                            <div class="sm:hidden">
                                <div v-for="user in activeGroupData.users" :key="'m'+user.id"
                                     style="border-bottom:1px solid #f5f0eb;padding:12px 4px;">
                                    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;">
                                        <div>
                                            <div style="font-size:14px;font-weight:600;color:#1c1410;">{{ user.phone }}</div>
                                            <div style="font-size:12px;color:#9ca3af;margin-top:2px;">{{ user.name || '未设置姓名' }}</div>
                                            <div style="font-size:12px;margin-top:2px;">
                                                <span style="color:#9ca3af;">密码：</span>
                                                <span v-if="user.plain_password" style="font-family:ui-monospace,Menlo,Consolas,monospace;color:#1c1410;letter-spacing:0.5px;user-select:all;">{{ user.plain_password }}</span>
                                                <span v-else style="color:#d1d5db;">—</span>
                                            </div>
                                        </div>
                                        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                                            <span class="badge" :class="roleBadgeClass(user.role)">{{ roleLabel(user.role) }}</span>
                                            <span class="badge" :class="user.enabled ? 'badge-green' : 'badge-gray'" style="font-size:11px;">{{ user.enabled ? '启用' : '禁用' }}</span>
                                            <span v-if="user.role !== 'super_admin'" class="badge"
                                                  :class="Number(user.activated) === 1 ? 'badge-green' : 'badge-gray'"
                                                  :style="Number(user.activated) === 1 ? 'font-size:11px;' : 'font-size:11px;color:#b45309;background:#fef3c7;'">
                                                {{ Number(user.activated) === 1 ? '已激活' : '待激活' }}
                                            </span>
                                        </div>
                                    </div>
                                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                                        <button v-if="user.role !== 'super_admin'" @click="toggleActivated(user)"
                                            :style="Number(user.activated) === 1 ? 'color:#d97706;border-color:#fbbf24' : 'color:#fff;background:#ea580c;border-color:#ea580c;font-weight:600;'"
                                            class="btn btn-sm btn-outline">
                                            {{ Number(user.activated) === 1 ? '取消激活' : '激活' }}
                                        </button>
                                        <button @click="toggleSuperAdmin(user)"
                                            style="color:#7c3aed;border-color:#c4b5fd;"
                                            class="btn btn-sm btn-outline">
                                            {{ user.role === 'super_admin' ? '取消超管' : '设为超管' }}
                                        </button>
                                        <button @click="openEditModal(user)" class="btn btn-sm btn-outline">编辑</button>
                                        <button @click="openResetPwdModal(user)" class="btn btn-sm btn-outline">重置密码</button>
                                        <button @click="toggleEnabled(user)"
                                            :style="user.enabled ? 'color:#d97706;border-color:#fbbf24' : 'color:#059669;border-color:#6ee7b7'"
                                            class="btn btn-sm btn-outline">
                                            {{ user.enabled ? '禁用' : '启用' }}
                                        </button>
                                        <button @click="openDeleteModal(user)"
                                            style="color:#dc2626;border-color:#fca5a5;"
                                            class="btn btn-sm btn-outline">删除</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 创建/编辑用户弹窗 -->
        <transition name="fade">
            <div v-if="showUserModal" class="modal-mask" @click.self="closeUserModal">
                <div class="modal-content">
                    <h3 class="text-lg font-semibold text-gray-800 mb-5">{{ isEdit ? '编辑用户' : '创建用户' }}</h3>

                    <div class="space-y-4">
                        <!-- 手机号 -->
                        <div>
                            <label class="block text-sm text-gray-500 mb-1">手机号 <span v-if="!isEdit" class="text-red-500">*</span></label>
                            <input v-model="form.phone" type="text" class="form-input"
                                :disabled="isEdit" placeholder="请输入手机号">
                        </div>

                        <!-- 密码（仅创建时） -->
                        <div v-if="!isEdit">
                            <label class="block text-sm text-gray-500 mb-1">密码 <span class="text-red-500">*</span></label>
                            <input v-model="form.password" type="password" class="form-input" placeholder="请输入密码">
                        </div>

                        <!-- 姓名 -->
                        <div>
                            <label class="block text-sm text-gray-500 mb-1">姓名</label>
                            <input v-model="form.name" type="text" class="form-input" placeholder="请输入姓名">
                        </div>

                        <!-- 角色 -->
                        <div>
                            <label class="block text-sm text-gray-500 mb-1">角色</label>
                            <select v-model="form.role" class="form-select">
                                <option value="super_admin">超级管理员</option>
                                <option value="enterprise">企业管理员</option>
                                <option value="employee">员工账号</option>
                                <!-- <option value="personal_sales">代理销售</option> 暂时隐藏 -->
                            </select>
                            <div v-if="false" style="margin-top:8px;">
                                <label class="block text-sm text-gray-500 mb-1">附加销售权限</label>
                                <select v-model="form.sales_type" class="form-select">
                                    <option value="">无</option>
                                    <option value="personal">代理销售</option>
                                </select>
                            </div>
                        </div>

                        <!-- 所属企业（非超管） -->
                        <div v-if="form.role !== 'super_admin'">
                            <label class="block text-sm text-gray-500 mb-1">所属企业</label>
                            <select v-model="form.parent_id" class="form-select">
                                <option :value="null">请选择企业</option>
                                <option v-for="ent in enterprises" :key="ent.id" :value="ent.id">
                                    {{ ent.name || ent.phone }}
                                </option>
                            </select>
                        </div>

                        <!-- 绑定发送人 -->
                        <div>
                            <label class="block text-sm text-gray-500 mb-1">绑定发送人</label>
                            <!-- 已绑定的发送人：可编辑别名（别名即系统显示名，留空则显示原始ID） -->
                            <div v-if="form.bound_senders.length > 0" class="mb-2" style="display:flex;flex-direction:column;gap:6px;">
                                <div v-for="(s, idx) in form.bound_senders" :key="s.sender"
                                     style="display:flex;align-items:center;gap:8px;background:#f9fafb;border:1px solid #eef0f2;border-radius:8px;padding:6px 8px;">
                                    <input v-model="s.sender_name" type="text" placeholder="设置别名（留空显示原始ID）"
                                           class="form-input" style="flex:1;height:30px;font-size:13px;">
                                    <span style="font-size:11px;color:#9ca3af;font-family:monospace;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;" :title="s.sender">{{ s.sender }}</span>
                                    <button @click="removeSender(idx)" type="button"
                                        class="text-red-400 hover:text-red-600" style="font-size:16px;line-height:1;flex-shrink:0;" title="移除">
                                        &times;
                                    </button>
                                </div>
                            </div>
                            <!-- 下拉选择 / 手动输入 添加发送人 -->
                            <div style="display:flex;gap:6px;align-items:center;">
                                <select @change="addSender($event)" class="form-select" style="font-size:13px;flex:1;">
                                    <option value="">选择已有发送人...</option>
                                    <option v-for="s in availableSenders" :key="s.sender" :value="s.sender">
                                        {{ s.sender_name || s.sender }} ({{ s.record_count }}条记录)
                                    </option>
                                </select>
                                <input v-model="customSenderId" type="text" class="form-input"
                                    placeholder="手动输入ID" style="width:130px;height:34px;font-size:13px;"
                                    @keyup.enter="addCustomSender()">
                                <button type="button" @click="addCustomSender()" class="btn btn-sm btn-outline"
                                    style="white-space:nowrap;" :disabled="!customSenderId.trim()">添加</button>
                            </div>
                        </div>
                    </div>

                    <!-- 错误提示 -->
                    <div v-if="formError" class="mt-4 bg-red-50 text-red-600 text-sm rounded-lg px-4 py-2">{{ formError }}</div>

                    <!-- 按钮 -->
                    <div class="flex justify-end gap-3 mt-6">
                        <button @click="closeUserModal" class="btn btn-outline">取消</button>
                        <button @click="submitUser" :disabled="submitting" class="btn btn-primary">
                            {{ submitting ? '提交中...' : '确定' }}
                        </button>
                    </div>
                </div>
            </div>
        </transition>

        <!-- 重置密码弹窗 -->
        <transition name="fade">
            <div v-if="showResetPwdModal" class="modal-mask" @click.self="closeResetPwdModal">
                <div class="modal-content">
                    <h3 class="text-lg font-semibold text-gray-800 mb-5">重置密码</h3>
                    <p class="text-sm text-gray-500 mb-4">正在为 <span class="font-medium text-gray-700">{{ resetPwdUser?.phone }}</span> 重置密码</p>

                    <div>
                        <label class="block text-sm text-gray-500 mb-1">新密码 <span class="text-red-500">*</span></label>
                        <input v-model="resetPwdForm.password" type="password" class="form-input" placeholder="请输入新密码">
                    </div>

                    <!-- 错误提示 -->
                    <div v-if="resetPwdError" class="mt-4 bg-red-50 text-red-600 text-sm rounded-lg px-4 py-2">{{ resetPwdError }}</div>

                    <div class="flex justify-end gap-3 mt-6">
                        <button @click="closeResetPwdModal" class="btn btn-outline">取消</button>
                        <button @click="submitResetPwd" :disabled="submitting" class="btn btn-primary">
                            {{ submitting ? '提交中...' : '确定' }}
                        </button>
                    </div>
                </div>
            </div>
        </transition>

        <!-- 删除确认弹窗 -->
        <transition name="fade">
            <div v-if="showDeleteModal" class="modal-mask" @click.self="closeDeleteModal">
                <div class="modal-content" style="width:min(380px, calc(100vw - 32px));">
                    <div style="text-align:center;margin-bottom:16px;">
                        <div style="width:48px;height:48px;background:#fef2f2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">
                            <svg style="width:24px;height:24px;color:#dc2626;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </div>
                        <h3 style="font-size:16px;font-weight:600;color:#111827;margin-bottom:6px;">确认删除账号</h3>
                        <p style="font-size:13px;color:#6b7280;">即将删除账号 <span style="font-weight:600;color:#374151;">{{ deleteUser?.phone }}</span><span v-if="deleteUser?.name">（{{ deleteUser?.name }}）</span></p>
                        <p style="font-size:12px;color:#ef4444;margin-top:6px;">删除后该账号将无法登录，且无法恢复</p>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button @click="closeDeleteModal" class="btn btn-outline">取消</button>
                        <button @click="confirmDelete" :disabled="submitting"
                            style="background:#dc2626;color:#fff;" class="btn">
                            {{ submitting ? '删除中...' : '确认删除' }}
                        </button>
                    </div>
                </div>
            </div>
        </transition>

        <!-- 提示消息 -->
        <transition name="fade">
            <div v-if="toast" class="fixed top-4 right-4 z-50 bg-white shadow-lg rounded-lg px-5 py-3 text-sm flex items-center gap-2 border"
                :class="toast.type === 'success' ? 'border-green-200 text-green-700' : 'border-red-200 text-red-700'">
                <svg v-if="toast.type === 'success'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                <svg v-else class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                {{ toast.msg }}
            </div>
        </transition>
    </template>
</div>

<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;

/* 鉴权工具函数 */
function getToken() { return localStorage.getItem('token'); }
function getUser() { try { return JSON.parse(localStorage.getItem('user')); } catch { return null; } }
function doLogout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = '/login'; }
async function authFetch(url, options = {}) {
    const headers = { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json', ...(options.headers || {}) };
    const resp = await fetch(url, { ...options, headers });
    if (resp.status === 401) { doLogout(); throw new Error('未登录'); }
    return resp;
}

createApp({
    setup() {
        /* 状态 */
        const ready = ref(false);
        const noPermission = ref(false);
        const currentUser = ref({});
        const loading = ref(false);
        const users = ref([]);
        const enterprises = ref([]);
        const expandedGroups = ref(new Set());
        const searchKeyword = ref('');
        const mobileMenuOpen = ref(false);

        // 按企业分组（含关键词过滤）
        const groupedUsers = computed(() => {
            const q = searchKeyword.value.trim().toLowerCase();
            // 普通账号管理不显示超级管理员（超管只在「内部账号」页管理）
            const base = isInternalView ? users.value : users.value.filter(u => u.role !== 'super_admin');
            const source = q
                ? base.filter(u =>
                    (u.name || '').toLowerCase().includes(q) ||
                    (u.phone || '').includes(q))
                : base;
            const map = new Map();
            for (const u of source) {
                const key = u.parent_id ? String(u.parent_id) : '__none__';
                const name = u.parent_name || (u.parent_id ? `企业${u.parent_id}` : '未分组');
                if (!map.has(key)) map.set(key, { key, name, users: [] });
                map.get(key).users.push(u);
            }
            const result = [];
            for (const [, g] of map) result.push(g);
            result.sort((a, b) => {
                // 未分组（待分配企业的注册用户）置顶，方便管理员拉入企业
                if (a.key === '__none__') return -1;
                if (b.key === '__none__') return 1;
                return a.name.localeCompare(b.name, 'zh');
            });
            return result;
        });

        // 左侧选中的企业分组（默认第一个，未分组已置顶）
        const activeGroup = ref('');
        const activeGroupData = computed(() => {
            const groups = groupedUsers.value;
            // 单企业视图（从企业管理进入）：锁定该企业，无人员则显示空，不落到别的企业
            const _ueid = new URLSearchParams(location.search).get('enterprise_id');
            if (_ueid) {
                const g = groups.find(x => x.key === _ueid);
                if (g) return g;
                const _uname = new URLSearchParams(location.search).get('enterprise_name') || '该企业';
                return { key: _ueid, name: _ueid === '__none__' ? '未分组' : _uname, users: [] };
            }
            if (!groups.length) return null;
            return groups.find(g => g.key === activeGroup.value) || groups[0];
        });

        // URL 预选企业（从企业管理页跳转进来：?enterprise_id=X）
        const _urlEnterpriseId = new URLSearchParams(location.search).get('enterprise_id');
        const _urlEnterpriseName = new URLSearchParams(location.search).get('enterprise_name') || '';
        // 内部账号视图：从「内部账号」入口进入（?role=super_admin），只列超级管理员
        const _urlRole = new URLSearchParams(location.search).get('role') || '';
        const isInternalView = _urlRole === 'super_admin';
        // 单企业视图 / 内部账号视图：隐藏左侧分组栏
        const singleEnterprise = !!_urlEnterpriseId || isInternalView;
        let _pendingGroup = _urlEnterpriseId || '';
        // 分组列表变化（搜索/加载）后：URL 指定企业优先选中（仅一次），否则若当前分组不存在则切第一个
        Vue.watch(groupedUsers, () => {
            const groups = groupedUsers.value;
            if (!groups.length) return;
            if (_pendingGroup && groups.find(g => g.key === _pendingGroup)) {
                activeGroup.value = _pendingGroup;
                _pendingGroup = '';
                return;
            }
            if (!groups.find(g => g.key === activeGroup.value)) {
                activeGroup.value = groups[0].key;
            }
        }, { immediate: true });

        function toggleGroup(key) { activeGroup.value = key; }
        const filterRole = ref(isInternalView ? 'super_admin' : '');

        /* 弹窗状态 */
        const showUserModal = ref(false);
        const isEdit = ref(false);
        const editUserId = ref(null);
        const form = reactive({ phone: '', password: '', name: '', role: 'employee', parent_id: null, bound_senders: [], is_sales: false, sales_type: '' });
        const formError = ref('');
        const submitting = ref(false);

        const showResetPwdModal = ref(false);
        const resetPwdUser = ref(null);
        const resetPwdForm = reactive({ password: '' });
        const resetPwdError = ref('');

        const showDeleteModal = ref(false);
        const deleteUser = ref(null);

        /* 提示消息 */
        const toast = ref(null);
        let toastTimer = null;
        function showToast(msg, type = 'success') {
            toast.value = { msg, type };
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.value = null; }, 3000);
        }

        /* 权限检查 */
        function checkAuth() {
            const token = getToken();
            if (!token) { doLogout(); return false; }
            const user = getUser();
            if (!user) { doLogout(); return false; }
            if (user.role !== 'super_admin') {
                noPermission.value = true;
                return false;
            }
            currentUser.value = user;
            return true;
        }

        /* 角色相关 */
        function roleLabel(role) {
            const map = { super_admin: '超级管理员', enterprise: '企业管理员', employee: '员工账号', sales: '代理销售', channel_sales: '代理销售', personal_sales: '代理销售' };
            return map[role] || role;
        }
        function roleBadgeClass(role) {
            const map = { super_admin: 'badge-red', enterprise: 'badge-blue', employee: 'badge-green', sales: 'badge-orange', channel_sales: 'badge-orange', personal_sales: 'badge-orange' };
            return map[role] || 'badge-gray';
        }
        function salesTypeLabel(t) {
            return (t === 'channel' || t === 'personal') ? '代理销售' : '';
        }

        /* 时间格式化 */
        function formatTime(t) {
            if (!t) return '-';
            return t.replace('T', ' ').substring(0, 19);
        }

        /* 获取用户列表 */
        async function fetchUsers() {
            loading.value = true;
            try {
                let url = '/api/auth/users';
                if (filterRole.value) url += '?role=' + filterRole.value;
                const resp = await authFetch(url);
                const data = await resp.json();
                if (data.code === 0) {
                    users.value = data.data || [];
                    // 默认全部展开
                    const keys = new Set();
                    for (const u of users.value) keys.add(u.parent_id ? String(u.parent_id) : '__none__');
                    expandedGroups.value = keys;
                } else {
                    showToast(data.msg || '获取用户列表失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            } finally {
                loading.value = false;
            }
        }

        /* 获取企业列表（用于所属企业下拉，从 enterprises 表取） */
        async function fetchEnterprises() {
            try {
                const resp = await authFetch('/api/auth/enterprises');
                const data = await resp.json();
                if (data.code === 0) {
                    enterprises.value = (data.data || []).filter(e => e.enabled);
                }
            } catch {}
        }

        /* 发送人列表（供绑定选择） */
        const allSenders = ref([]);
        async function fetchSenders() {
            try {
                const resp = await authFetch('/api/auth/senders');
                const data = await resp.json();
                if (data.code === 0) {
                    allSenders.value = data.data || [];
                }
            } catch {}
        }

        /* 计算可选发送人（排除已绑定的） */
        const availableSenders = Vue.computed(() => {
            const boundIds = new Set(form.bound_senders.map(s => s.sender));
            return allSenders.value.filter(s => !boundIds.has(s.sender));
        });

        /* 添加发送人 */
        function addSender(event) {
            const senderId = event.target.value;
            if (!senderId) return;
            const senderInfo = allSenders.value.find(s => s.sender === senderId);
            if (senderInfo && !form.bound_senders.some(s => s.sender === senderId)) {
                form.bound_senders.push({
                    sender: senderInfo.sender,
                    sender_name: senderInfo.sender_name || '',
                });
            }
            event.target.value = '';
        }

        /* 手动输入发送人ID */
        const customSenderId = ref('');
        function addCustomSender() {
            const sid = customSenderId.value.trim();
            if (!sid) return;
            if (form.bound_senders.some(s => s.sender === sid)) {
                customSenderId.value = '';
                return;
            }
            // 尝试从已有列表匹配名称
            const existing = allSenders.value.find(s => s.sender === sid);
            form.bound_senders.push({
                sender: sid,
                sender_name: existing ? (existing.sender_name || '') : '',
            });
            customSenderId.value = '';
        }

        /* 移除发送人 */
        function removeSender(idx) {
            form.bound_senders.splice(idx, 1);
        }

        /* 创建用户弹窗 */
        function openCreateModal() {
            isEdit.value = false;
            editUserId.value = null;
            form.phone = '';
            form.password = '';
            form.name = '';
            // 内部账号入口创建时默认超级管理员
            form.role = isInternalView ? 'super_admin' : 'employee';
            // 从某企业的人员管理进入时，所属企业默认选中该企业（未分组 __none__ 不预选）
            form.parent_id = (_urlEnterpriseId && _urlEnterpriseId !== '__none__') ? Number(_urlEnterpriseId) : null;
            form.bound_senders = [];
            form.is_sales = false;
            form.sales_type = '';
            formError.value = '';
            showUserModal.value = true;
            fetchEnterprises();
            fetchSenders();
        }

        /* 编辑用户弹窗 */
        function openEditModal(user) {
            isEdit.value = true;
            editUserId.value = user.id;
            form.phone = user.phone;
            form.password = '';
            form.name = user.name || '';
            // 代理销售已统一：旧的 channel_sales 归一到 personal_sales 以匹配单一下拉项
            form.role = (user.role === 'channel_sales' || user.role === 'sales') ? 'personal_sales' : user.role;
            form.parent_id = user.parent_id || null;
            form.bound_senders = (user.bound_senders || []).map(s => ({
                sender: s.sender,
                sender_name: s.sender_name || '',
            }));
            form.is_sales = !!user.is_sales;
            form.sales_type = (user.sales_type === 'channel') ? 'personal' : (user.sales_type || '');
            formError.value = '';
            showUserModal.value = true;
            fetchEnterprises();
            fetchSenders();
        }

        function closeUserModal() {
            showUserModal.value = false;
        }

        /* 提交创建/编辑 */
        async function submitUser() {
            formError.value = '';
            if (!isEdit.value) {
                if (!form.phone.trim()) { formError.value = '请输入手机号'; return; }
                if (!form.password.trim()) { formError.value = '请输入密码'; return; }
            }
            submitting.value = true;
            try {
                let url, method, body;
                if (isEdit.value) {
                    url = '/api/auth/users/' + editUserId.value;
                    method = 'PUT';
                    body = {
                        name: form.name,
                        role: form.role,
                        parent_id: form.role !== 'super_admin' ? form.parent_id : null,
                        is_sales: !!form.sales_type,
                        sales_type: form.sales_type || '',
                        bound_senders: form.bound_senders,
                    };
                } else {
                    url = '/api/auth/users';
                    method = 'POST';
                    body = {
                        phone: form.phone.trim(),
                        password: form.password,
                        name: form.name,
                        role: form.role,
                        parent_id: form.role !== 'super_admin' ? form.parent_id : null,
                        is_sales: !!form.sales_type,
                        sales_type: form.sales_type || '',
                        bound_senders: form.bound_senders,
                    };
                }
                const resp = await authFetch(url, { method, body: JSON.stringify(body) });
                const data = await resp.json();
                if (data.code === 0) {
                    showToast(isEdit.value ? '用户已更新' : '用户已创建');
                    closeUserModal();
                    fetchUsers();
                } else {
                    formError.value = data.msg || '操作失败';
                }
            } catch (e) {
                formError.value = '网络错误';
            } finally {
                submitting.value = false;
            }
        }

        /* 重置密码弹窗 */
        function openResetPwdModal(user) {
            resetPwdUser.value = user;
            resetPwdForm.password = '';
            resetPwdError.value = '';
            showResetPwdModal.value = true;
        }
        function closeResetPwdModal() {
            showResetPwdModal.value = false;
        }
        async function submitResetPwd() {
            resetPwdError.value = '';
            if (!resetPwdForm.password.trim()) { resetPwdError.value = '请输入新密码'; return; }
            submitting.value = true;
            try {
                const resp = await authFetch('/api/auth/users/' + resetPwdUser.value.id + '/reset-password', {
                    method: 'POST',
                    body: JSON.stringify({ password: resetPwdForm.password }),
                });
                const data = await resp.json();
                if (data.code === 0) {
                    showToast('密码已重置');
                    closeResetPwdModal();
                } else {
                    resetPwdError.value = data.msg || '操作失败';
                }
            } catch (e) {
                resetPwdError.value = '网络错误';
            } finally {
                submitting.value = false;
            }
        }

        /* 删除用户 */
        function openDeleteModal(user) {
            deleteUser.value = user;
            showDeleteModal.value = true;
        }
        function closeDeleteModal() {
            showDeleteModal.value = false;
            deleteUser.value = null;
        }
        async function confirmDelete() {
            if (!deleteUser.value) return;
            submitting.value = true;
            try {
                const resp = await authFetch('/api/auth/users/' + deleteUser.value.id, { method: 'DELETE' });
                const data = await resp.json();
                if (data.code === 0) {
                    showToast('账号 ' + deleteUser.value.phone + ' 已删除');
                    closeDeleteModal();
                    fetchUsers();
                } else {
                    showToast(data.msg || '删除失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            } finally {
                submitting.value = false;
            }
        }

        /* 启用/禁用切换 */
        async function toggleEnabled(user) {
            const newEnabled = !user.enabled;
            const action = newEnabled ? '启用' : '禁用';
            try {
                const resp = await authFetch('/api/auth/users/' + user.id, {
                    method: 'PUT',
                    body: JSON.stringify({ enabled: newEnabled }),
                });
                const data = await resp.json();
                if (data.code === 0) {
                    showToast('已' + action + '用户 ' + user.phone);
                    fetchUsers();
                } else {
                    showToast(data.msg || action + '失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        /* 激活/取消激活切换 */
        async function toggleActivated(user) {
            const newActivated = Number(user.activated) === 1 ? 0 : 1;
            const action = newActivated ? '激活' : '取消激活';
            try {
                const resp = await authFetch('/api/auth/users/' + user.id, {
                    method: 'PUT',
                    body: JSON.stringify({ activated: newActivated }),
                });
                const data = await resp.json();
                if (data.code === 0) {
                    showToast('已' + action + '用户 ' + user.phone);
                    fetchUsers();
                } else {
                    showToast(data.msg || action + '失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        /* 设为/取消 内部超级管理员（来回切换权限） */
        async function toggleSuperAdmin(user) {
            const toSuper = user.role !== 'super_admin';
            if (!toSuper && currentUser.value && Number(currentUser.value.id) === Number(user.id)) {
                showToast('不能取消自己的超管权限', 'error');
                return;
            }
            const action = toSuper ? '设为内部超管' : '取消超管权限';
            const tip = toSuper
                ? '确定把账号 ' + user.phone + ' 设为内部超级管理员吗？\n设置后该账号将出现在「内部账号」列表，并拥有超管权限。'
                : '确定取消账号 ' + user.phone + ' 的超管权限吗？\n取消后将变为未分组员工，需重新分配企业。';
            if (!confirm(tip)) return;
            try {
                const body = toSuper ? { role: 'super_admin', parent_id: null } : { role: 'employee', parent_id: null };
                const resp = await authFetch('/api/auth/users/' + user.id, {
                    method: 'PUT',
                    body: JSON.stringify(body),
                });
                const data = await resp.json();
                if (data.code === 0) {
                    showToast('已' + action + '：' + user.phone);
                    fetchUsers();
                } else {
                    showToast(data.msg || (action + '失败'), 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        function logout() { doLogout(); }

        /* 初始化 */
        onMounted(() => {
            if (checkAuth()) {
                ready.value = true;
                fetchUsers();
            }
        });

        return {
            ready, noPermission, currentUser, loading, users, enterprises,
            filterRole, fetchUsers, searchKeyword,
            showUserModal, isEdit, form, formError, submitting,
            openCreateModal, openEditModal, closeUserModal, submitUser,
            showResetPwdModal, resetPwdUser, resetPwdForm, resetPwdError,
            openResetPwdModal, closeResetPwdModal, submitResetPwd,
            showDeleteModal, deleteUser, openDeleteModal, closeDeleteModal, confirmDelete,
            toggleEnabled, toggleActivated, toggleSuperAdmin, logout, toast, urlEnterpriseName: _urlEnterpriseName, singleEnterprise, isInternalView,
            groupedUsers, expandedGroups, toggleGroup, activeGroup, activeGroupData,
            roleLabel, roleBadgeClass, salesTypeLabel, formatTime,
            allSenders, availableSenders, addSender, removeSender, customSenderId, addCustomSender,
            mobileMenuOpen,
        };
    }
}).mount('#app');
</script>
</body>
